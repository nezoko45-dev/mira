<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mira — AI Companion</title>
<script src="https://cdn.deepgram.com/widgets/latest/widget.umd.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#241326 0,#0b0810 45%,#050407 100%);color:#f8eef8;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
.app{width:min(1100px,100%);padding:28px 20px 50px}
header{text-align:center;margin-bottom:20px}
h1{margin:0;font-size:34px;letter-spacing:.04em}
.sub{color:#bcaabd;margin-top:6px}
.card{background:rgba(18,12,22,.86);border:1px solid #3b293f;border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.45);overflow:hidden}
.stage{position:relative;min-height:520px;display:grid;place-items:center;background:#09070b}
.stage img,.stage video{width:100%;height:520px;object-fit:cover;display:block}
.stage video{position:absolute;inset:0}
.placeholder{position:absolute;bottom:16px;left:16px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.55);font-size:12px;color:#d8c9da}
.bottom{padding:20px}
.status{display:flex;align-items:center;gap:10px;color:#cdb8cf;font-size:14px;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#8b4d9c;box-shadow:0 0 14px #9b5daf}
#transcript{min-height:58px;color:#eee0ee;font-size:16px;line-height:1.5;margin-bottom:16px}
.setup{display:none;padding:20px;border-top:1px solid #3b293f}
.setup.show{display:block}
.setup h2{margin:0 0 12px;font-size:18px}
.grid{display:grid;gap:10px}
input{width:100%;padding:12px 13px;background:#0d0a10;border:1px solid #49374c;color:white;border-radius:12px;outline:none}
input:focus{border-color:#9e65ad}
button{border:0;border-radius:12px;padding:12px 16px;background:#9a5aad;color:white;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}
.hint{font-size:12px;color:#9e8ca0;margin-top:10px}
#agent-container{min-height:100px}
</style>
</head>
<body>
<main class="app">
<header><h1>Mira</h1><div class="sub">your voice companion</div></header>
<section class="card">
<div class="stage">
<img src="luna%20mouth%20closed.png" id="still" alt="Mira">
<video id="miraVideo" playsinline autoplay muted loop></video>
<div class="placeholder" id="videoStatus">Waiting for Mira to speak…</div>
</div>
<div class="bottom">
<div class="status"><span class="dot"></span><span id="status">Loading Mira…</span></div>
<div id="transcript">Start the conversation and Mira will answer with voice.</div>
<div id="agent-container"></div>
</div>
<div class="setup" id="setup">
<h2>Mira setup</h2>
<div class="grid">
<input id="dgKey" type="password" placeholder="Deepgram API key">
<input id="falKey" type="password" placeholder="fal.ai key">
<button id="save">Save & start Mira</button>
</div>
<div class="hint">Only your Deepgram and fal.ai keys are needed. The Mira voice agent is configured directly in this app.</div>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let videoBusy=false;
let videoQueue=Promise.resolve();
let idleUrl='';

async function loadIdleVideo(){
  try{
    $('videoStatus').textContent='Generating Mira idle video…';
    const r=await fetch('/api/idle-video',{method:'POST'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Idle video generation failed');
    idleUrl=j.url;
    const v=$('miraVideo');
    v.src=idleUrl; v.loop=true; v.muted=true; v.load();
    try{await v.play()}catch{}
    $('videoStatus').textContent='Mira is waiting…';
  }catch(e){ console.error(e); $('videoStatus').textContent='Mira is waiting…'; }
}

function setStatus(t){$('status').textContent=t}
function enqueueVideo(text){
  videoQueue=videoQueue.then(()=>makeVideo(text)).catch(e=>{
    console.error(e); $('videoStatus').textContent='Video generation failed';
  });
}
async function makeVideo(text){
  if(!text || !text.trim()) return;
  videoBusy=true;
  $('videoStatus').textContent='Mira is generating a video…';
  const r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||'Video generation failed');
  const v=$('miraVideo');
  v.loop=false;
  v.muted=true;
  v.src=j.url;
  v.load();
  try{await v.play()}catch{}
  $('videoStatus').textContent='Mira is speaking';
  videoBusy=false;
  v.onended=()=>{
    if(idleUrl){ v.loop=true; v.src=idleUrl; v.load(); v.play().catch(()=>{}); $('videoStatus').textContent='Mira is waiting…'; }
  };
}

async function start(){
  try{
    const c=await fetch('/api/config').then(r=>r.json());
    if(!c.ready){
      $('setup').classList.add('show');
      setStatus('Add your API keys below');
      return;
    }
    $('setup').classList.remove('show');
    setStatus('Ready — press the microphone to talk');
    loadIdleVideo();
    DeepgramAgent.init({
      tokenFactory:()=>fetch('/api/deepgram-token').then(async r=>{
        if(!r.ok) throw new Error(await r.text());
        return r.text();
      }),
      agent:{
        language:'en',
        listen:{provider:{type:'deepgram',version:'v2',model:'flux-general-en'}},
        think:{provider:{type:'open_ai',model:'gpt-4o-mini',temperature:0.8},prompt:'You are Mira, a warm gothic AI companion. Speak naturally and conversationally. Keep spoken replies concise enough for a short video clip. Do not use markdown, stage directions, or emojis. Your voice is a friendly Filipino English speaker.'},
        speak:{provider:{type:'deepgram',version:'v1',model:'aura-2-amalthea-en',speed:1.0}}
      },
      layout:'button',
      buttonId:'mira-talk-button',
      showTranscript:true,
      showMicToggle:true,
      showSpeakerToggle:true,
      showTextInput:true,
      vad:true,
      colorScheme:'dark',
      text:{name:'Mira',startLabel:'Talk to Mira',stopLabel:'End conversation',connectingLabel:'Connecting…',inputPlaceholder:'Talk to Mira…',emptyStateHint:'Press start to begin talking.'},
      overrides:{
        systemPrompt:'You are Mira, a warm gothic AI companion. Speak naturally and conversationally. Keep spoken replies concise enough for a short video clip. Do not use markdown, stage directions, or emojis. Use a natural Filipino-English speaking style.',
        greeting:'Hi, I’m Mira. It’s nice to hear your voice.'
      },
      on:{
        onConnect:()=>setStatus('Listening — Mira is here'),
        onDisconnect:()=>setStatus('Disconnected'),
        onError:e=>{console.error(e);setStatus('Voice connection error')},
        onAgentError:e=>{console.error(e);setStatus('Mira reported an error')},
        onMessage:m=>{
          if(!m || !m.content) return;
          if(m.role==='user'){
            $('transcript').textContent='You: '+m.content;
          }else if(m.role==='assistant'){
            $('transcript').textContent='Mira: '+m.content;
            enqueueVideo(m.content);
          }
        },
        onAgentStartedSpeaking:()=>setStatus('Mira is speaking')
      }
    });
  }catch(e){
    console.error(e);
    setStatus(e.message||'Could not start Mira');
  }
}

$('save').onclick=async()=>{
  const body={deepgramApiKey:$('dgKey').value,falKey:$('falKey').value};
  const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){alert(j.error||'Setup failed');return}
  location.reload();
};

const talk=document.createElement('button');
talk.id='mira-talk-button';
talk.textContent='Talk to Mira';
$('agent-container').appendChild(talk);
start();
</script>
</body>
</html>
