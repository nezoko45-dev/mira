<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira EXE</title><style>*{box-sizing:border-box}body{margin:0;background:#09070d;color:#fff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.logo{font-size:28px;font-weight:900}.logo b{color:#ff4f9a}.state{padding:8px 12px;border:1px solid #49304f;border-radius:99px}.grid{display:grid;grid-template-columns:1fr 350px;gap:18px;margin-top:16px}.stage,.panel{background:#140e19;border:1px solid #382642;border-radius:24px;overflow:hidden}.stage{height:calc(100vh - 100px);min-height:560px;position:relative}.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage video[hidden]{display:none}.caption{position:absolute;left:18px;bottom:18px;text-shadow:0 2px 14px #000}.caption h1{margin:0;font-size:30px}.panel{padding:15px;margin-bottom:14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid #54355d;border-bottom:3px solid #1a0e20;border-radius:14px;padding:13px;background:#291a31;color:#fff;font-weight:900;cursor:pointer;transition:.12s}.btn:hover{filter:brightness(1.2);transform:translateY(-2px);box-shadow:0 8px 22px #0008}.btn:active{transform:translateY(3px);border-bottom-width:1px}.btn.primary{background:linear-gradient(135deg,#ff4f9a,#8b43ff)}.btn.active{outline:2px solid #ff65a5;box-shadow:0 0 24px #ff4f9a77}.btn:disabled{opacity:.45;cursor:not-allowed}.status{color:#b9a9bb;line-height:1.45;margin-top:12px;min-height:22px}.chat{height:230px;overflow:auto;margin:10px 0}.msg{background:#24172c;border-radius:13px;padding:9px;margin:7px 0}.user{background:#5a2349;margin-left:25px}.form{display:flex;gap:7px}.form input{flex:1;min-width:0;background:#0b080e;border:1px solid #49324f;border-radius:11px;color:#fff;padding:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stage{height:65vh;min-height:450px}}</style></head><body><main><div class="top"><div class="logo">Mira <b>EXE</b></div><div class="state" id="state">READY</div></div><div class="grid"><section class="stage"><img id="mira" src="/luna%20mouth%20closed.png"><video id="video" hidden autoplay muted playsinline loop></video><div class="caption"><h1>Mira</h1><small id="hint">Local EXE companion</small></div></section><aside><div class="panel"><div class="buttons"><button class="btn primary" id="voice">🎙 Start Voice</button><button class="btn" id="stop" disabled>■ Stop</button><button class="btn" id="animate">✨ Animate</button><button class="btn" id="setup">⚙ Setup</button></div><div class="status" id="status">Mira is ready.</div></div><div class="panel"><b>Chat</b><div class="chat" id="chat"></div><form class="form" id="form"><input id="text" placeholder="Talk to Mira…"><button class="btn primary">Send</button></form></div></aside></div></main><script>
const $=id=>document.getElementById(id);let session,mic,player,dg;
function st(x){$('state').textContent=x.toUpperCase();$('status').textContent=x;$('hint').textContent=x}
function add(r,t){if(!t)return;let d=document.createElement('div');d.className='msg '+(r==='user'?'user':'');d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9}
$('setup').onclick=()=>st('Setup is stored by Mira.exe');
$('voice').onclick=async()=>{let b=$('voice');b.disabled=true;st('Starting voice…');try{let c=await (await fetch('/api/config')).json();if(!c.ready)throw Error('Deepgram is not configured in Mira.exe.');if(!dg)dg=await import('https://cdn.jsdelivr.net/npm/@deepgram/agents/+esm');session=new dg.AgentSession({auth:{tokenFactory:async()=>{let r=await fetch('/api/deepgram-token');if(!r.ok)throw Error(await r.text());return r.text()}},agent:c.agentId});player=new dg.AgentPlayer({sampleRate:24000});session.on('audio',x=>player.queue(x));session.on('conversation-text',x=>add(x.role==='user'?'user':'assistant',x.content));await session.connect();mic=new dg.AgentMicrophone(x=>session.sendAudio(x),{sampleRate:16000,echoCancellation:true,noiseSuppression:true,autoGainControl:true});await mic.start();$('stop').disabled=false;b.classList.add('active');st('Mira is listening')}catch(e){b.disabled=false;st('Voice failed: '+e.message)}};
$('stop').onclick=()=>{try{mic?.stop()}catch{}try{session?.disconnect()}catch{}mic=null;session=null;player=null;$('voice').disabled=false;$('stop').disabled=true;$('voice').classList.remove('active');st('Voice stopped')};
$('animate').onclick=async()=>{let b=$('animate');b.disabled=true;b.classList.add('active');st('Generating video…');try{let r=await fetch('/api/video',{method:'POST'}),j=await r.json();if(!r.ok)throw Error(j.error);$('video').src=j.url+'?'+Date.now();$('video').hidden=false;$('mira').hidden=true;await $('video').play();st('Mira video playing')}catch(e){st('Animation failed: '+e.message)}finally{b.disabled=false;b.classList.remove('active')}};
$('form').onsubmit=e=>{e.preventDefault();let t=$('text').value.trim();if(!t)return;if(!session){st('Start Voice first');return}add('user',t);session.injectUserMessage(t);$('text').value='';st('Mira is thinking…')};
fetch('/api/health').then(()=>st('EXE server connected')).catch(()=>st('Start Mira.exe first'));
</script></body></html>
