name: Build Luna Portable Chrome App

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'openvoice/**'
      - 'luna mouth open.png'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchaudio
          python -m pip install git+https://github.com/myshell-ai/OpenVoice.git
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m pip install unidic unidic-lite pyinstaller huggingface_hub soundfile librosa wavmark
          python -m unidic download
      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='myshell-ai/OpenVoiceV2', local_dir='openvoice/checkpoints_v2')"
      - name: Build Luna backend EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name Luna-Backend --collect-all openvoice --collect-all melo --collect-all torch --collect-all torchaudio openvoice/server.py
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item desktop/desktop.html release/Luna.html
          Copy-Item 'luna mouth open.png' release/'luna mouth open.png'
          Copy-Item 'luna mouth closed.png' release/'luna mouth closed.png'
          Copy-Item desktop/start.bat release/start.bat
          Copy-Item desktop/README.txt release/README.txt
          New-Item -ItemType Directory -Force -Path release/Luna-Backend | Out-Null
          Copy-Item -Recurse -Force dist/Luna-Backend/* release/Luna-Backend/
          Copy-Item -Recurse -Force openvoice/checkpoints_v2 release/checkpoints_v2
          Compress-Archive -Path release/* -DestinationPath Luna-Gothic-Companion-Chrome-Windows.zip -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Gothic-Companion-Chrome-Windows
          path: Luna-Gothic-Companion-Chrome-Windows.zip
          if-no-files-found: error
