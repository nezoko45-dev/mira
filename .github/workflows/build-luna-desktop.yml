name: Build Luna Desktop EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'openvoice/**'
      - 'luna mouth open.png'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchaudio
          python -m pip install git+https://github.com/myshell-ai/OpenVoice.git
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m pip install unidic unidic-lite pyinstaller huggingface_hub soundfile librosa wavmark
          python -m unidic download

      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='myshell-ai/OpenVoiceV2', local_dir='openvoice/checkpoints_v2')"

      - name: Build OpenVoice backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name openvoice-server --collect-all openvoice --collect-all melo --collect-all torch --collect-all torchaudio openvoice/server.py
          New-Item -ItemType Directory -Force -Path openvoice/openvoice-server | Out-Null
          Copy-Item -Recurse -Force dist/openvoice-server/* openvoice/openvoice-server/
          Remove-Item -Recurse -Force dist, build

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Gothic-Companion-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
