name: Build Luna HTML App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'luna-app/**'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-html-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r luna-app/requirements.txt pyinstaller

      - name: Assemble runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/luna | Out-Null
          Copy-Item luna-app/index.html build/luna/index.html
          Copy-Item 'luna mouth closed.png' build/luna/luna.png

      - name: Build backend EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Luna-Backend --collect-all cv2 --collect-all imageio_ffmpeg --collect-all numpy luna-app/backend.py
          Copy-Item dist/Luna-Backend.exe build/luna/Luna-Backend.exe

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path build/luna/index.html)) { throw 'index.html missing' }
          if (!(Test-Path build/luna/luna.png)) { throw 'luna.png missing' }
          if (!(Test-Path build/luna/Luna-Backend.exe)) { throw 'Luna-Backend.exe missing' }
          Get-ChildItem build/luna | Format-Table Name,Length

      - name: Create launcher
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Luna Backend" /min "%~dp0Luna-Backend.exe"
          timeout /t 2 /nobreak >nul
          start "Luna HTML App" http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/luna/START-LUNA.bat
          @'
          Luna Gothic HTML App

          Run START-LUNA.bat.
          The local Python backend serves the HTML app and creates MP4 videos from luna.png.
          Voice calls use the browser microphone. When a call ends, Luna automatically sends a random follow-up message and generates another video.
          '@ | Set-Content -Encoding UTF8 build/luna/README.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/luna/* -DestinationPath Luna-HTML-App-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-HTML-App-Windows
          path: Luna-HTML-App-Windows.zip
          retention-days: 14
