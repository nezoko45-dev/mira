name: Build Luna Cloud Lip-Sync App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'luna-app/index.html'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-html-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Chrome app
        shell: bash
        run: |
          rm -rf build/luna
          mkdir -p build/luna
          cp luna-app/index.html build/luna/index.html
          cp 'luna mouth closed.png' build/luna/luna.png
          cat > build/luna/README.txt <<'EOF'
          Luna Gothic Companion - Cloud Wav2Lip Edition

          Open index.html in Chrome through a local/static web server.
          No Python, PyTorch, librosa, Wav2Lip executable, or Electron runtime is included.

          The Animate Luna button sends luna.png and an audio file to a hosted Wav2Lip Space and plays the returned MP4.
          Luna uses only the single mouth-closed image.
          EOF

      - name: Verify package
        shell: bash
        run: |
          test -f build/luna/index.html
          test -f build/luna/luna.png
          grep -q 'hosted Wav2Lip' build/luna/index.html
          find build/luna -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Zip
        shell: bash
        run: cd build/luna && zip -r ../../Luna-Cloud-Wav2Lip.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Cloud-Wav2Lip
          path: Luna-Cloud-Wav2Lip.zip
          retention-days: 14
