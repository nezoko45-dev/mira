name: Build Luna Gothic Companion Electron

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'mira-companion/**'
      - 'openvoice/**'
      - '.github/workflows/build-electron-mira.yml'
      - 'luna mouth closed.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
          python -m pip install -r mira-companion/requirements.txt
          python -m pip install torch torchaudio

      - name: Get OpenVoice V2
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git build/OpenVoice
          python -m pip install -e build/OpenVoice --no-deps
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download

      - name: Verify OpenVoice V2 runtime
        shell: pwsh
        run: |
          python -c "import torch, openvoice, melo, librosa, wavmark; from openvoice.api import ToneColorConverter; from melo.api import TTS; print('OpenVoice V2 runtime OK'); print('torch', torch.__version__)"

      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('myshell-ai/OpenVoiceV2', local_dir='build/OpenVoice/checkpoints_v2')"

      - name: Build OpenVoice worker EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name openvoice-server --paths build/OpenVoice --collect-all openvoice --collect-all melo --collect-all torch --collect-all torchaudio --collect-all librosa --collect-all wavmark --hidden-import=melo.api --hidden-import=openvoice.api openvoice/server.py
          if (-not (Test-Path 'dist/openvoice-server.exe')) { throw 'OpenVoice worker EXE was not created.' }

      - name: Build Mira backend EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Backend --collect-all cv2 --collect-all imageio_ffmpeg mira-companion/backend.py
          if (-not (Test-Path 'dist/Mira-Backend.exe')) { throw 'Mira backend EXE was not created.' }

      - name: Assemble Electron runtime
        shell: pwsh
        run: |
          Remove-Item desktop/runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path desktop/runtime/checkpoints_v2 | Out-Null
          Copy-Item dist/Mira-Backend.exe desktop/runtime/Mira-Backend.exe
          Copy-Item dist/openvoice-server.exe desktop/runtime/openvoice-server.exe
          Copy-Item desktop/desktop.html desktop/runtime/index.html
          Copy-Item 'luna mouth closed.png' desktop/runtime/luna.png
          Copy-Item build/OpenVoice/checkpoints_v2/* desktop/runtime/checkpoints_v2/ -Recurse
          if (-not (Test-Path 'desktop/runtime/index.html')) { throw 'Packaged UI index.html is missing.' }
          if (-not (Test-Path 'desktop/runtime/luna.png')) { throw 'Packaged Luna image is missing.' }
          if (-not (Test-Path 'desktop/runtime/Mira-Backend.exe')) { throw 'Packaged Mira backend is missing.' }
          if (-not (Test-Path 'desktop/runtime/openvoice-server.exe')) { throw 'Packaged OpenVoice server is missing.' }
          Get-ChildItem desktop/runtime -Recurse | Select-Object FullName,Length

      - name: Build Electron installer
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run dist
          $installer = Get-ChildItem 'dist/*Setup.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'Electron installer was not created.' }
          $installer | Select-Object FullName,Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Gothic-Companion-Electron
          path: desktop/dist/*Setup.exe
          if-no-files-found: error
          retention-days: 14
