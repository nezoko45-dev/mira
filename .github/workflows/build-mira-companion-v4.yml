name: Build Mira Companion V6
on:
  workflow_dispatch:
  push:
    paths:
      - 'mira-companion/**'
      - 'openvoice/**'
      - '.github/workflows/build-mira-companion-v4.yml'
      - 'luna mouth closed.png'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install stable build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
          python -m pip install -r mira-companion/requirements.txt
          python -m pip install torch torchaudio
      - name: Get OpenVoice V2 source directly from upstream
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git build/OpenVoice
          python -m pip install -e build/OpenVoice --no-deps
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: Verify OpenVoice V2 runtime
        shell: pwsh
        run: |
          python -c "import pkg_resources, openvoice; from openvoice.api import ToneColorConverter; from melo.api import TTS; print('OpenVoice V2 source runtime OK - no Whisper dependency')"
      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('myshell-ai/OpenVoiceV2', local_dir='build/OpenVoice/checkpoints_v2')"
      - name: Build OpenVoice V2 worker
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name openvoice-server --paths build/OpenVoice --collect-all openvoice --collect-all melo --collect-all torch --collect-all torchaudio openvoice/server.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item dist/openvoice-server.exe build/package/openvoice-server.exe
          Copy-Item -Recurse build/OpenVoice/checkpoints_v2 build/package/checkpoints_v2
          Copy-Item 'mira-companion/index.html' build/package/index.html
          Copy-Item 'luna mouth closed.png' build/package/luna.png
      - name: Build Mira backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Companion --collect-all cv2 --collect-all imageio_ffmpeg mira-companion/backend.py
          Copy-Item dist/Mira-Companion.exe build/package/Mira-Companion.exe
      - name: Launcher and README
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Mira" /min Mira-Companion.exe
          timeout /t 4 /nobreak >nul
          start "Mira Chrome" chrome.exe --app=http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/package/START-MIRA.bat
          @'
          Mira AI Companion - Local Ollama + OpenVoice V2

          REQUIREMENT: Install Ollama for Windows before starting Mira.
          Make sure the local model qwen3:4b is installed in Ollama.
          Mira does NOT require a Claude, OpenAI, Gemini, or OpenRouter API key.

          Start START-MIRA.bat.
          Put a short clean permitted voice reference at:
          %APPDATA%\LunaGothicCompanion\voice_reference.wav

          Mira uses ONE visual reference image: luna.png.
          Each spoken reply creates a new MP4 using that image, OpenVoice V2 audio, and Python audio-driven animation.
          OpenVoice voice cloning uses the reference WAV directly and does NOT use faster-whisper or whisper-timestamped.
          '@ | Set-Content -Encoding UTF8 build/package/README.txt
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath Mira-AI-Companion-Windows.zip -Force
      - name: Split ZIP into chat-safe parts
        shell: pwsh
        run: |
          $source = [IO.File]::OpenRead("Mira-AI-Companion-Windows.zip")
          $partSize = 150MB
          $buffer = New-Object byte[] (4MB)
          $part = 1
          try {
            while ($source.Position -lt $source.Length) {
              $name = "Mira-AI-Companion-Windows.part$part"
              $dest = [IO.File]::Create($name)
              try {
                $remaining = [Math]::Min($partSize, $source.Length - $source.Position)
                while ($remaining -gt 0) {
                  $read = $source.Read($buffer, 0, [Math]::Min($buffer.Length, $remaining))
                  if ($read -le 0) { break }
                  $dest.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $dest.Dispose() }
              $part++
            }
          } finally { $source.Dispose() }
          Get-ChildItem Mira-AI-Companion-Windows.part* | Format-Table Name,Length
      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows-Part1
          path: Mira-AI-Companion-Windows.part1
          retention-days: 14
      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows-Part2
          path: Mira-AI-Companion-Windows.part2
          retention-days: 14
      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows-Part3
          path: Mira-AI-Companion-Windows.part3
          retention-days: 14
      - name: Upload part 4
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows-Part4
          path: Mira-AI-Companion-Windows.part4
          retention-days: 14
