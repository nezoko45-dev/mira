name: Build Mira Companion V6

on:
  workflow_dispatch:
  push:
    paths:
      - 'mira-companion/**'
      - 'openvoice/**'
      - '.github/workflows/build-mira-companion-v4.yml'
      - 'luna mouth closed.png'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install stable build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
          python -m pip install -r mira-companion/requirements.txt
          python -m pip install torch torchaudio

      - name: Get OpenVoice V2 source directly from upstream
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/myshell-ai/OpenVoice.git build/OpenVoice
          python -m pip install -e build/OpenVoice --no-deps
          python -m pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download

      - name: Verify OpenVoice V2 runtime
        shell: pwsh
        run: |
          python -c "import openvoice; from openvoice.api import ToneColorConverter; from melo.api import TTS; print('OpenVoice V2 source runtime OK - no Whisper dependency')"

      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('myshell-ai/OpenVoiceV2', local_dir='build/OpenVoice/checkpoints_v2')"

      - name: Build OpenVoice V2 worker
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name openvoice-server --paths build/OpenVoice --collect-all openvoice --collect-all melo --collect-all torch --collect-all torchaudio openvoice/server.py

      - name: Assemble core package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/parts/core | Out-Null
          Copy-Item dist/openvoice-server.exe build/parts/core/openvoice-server.exe
          Copy-Item 'mira-companion/index.html' build/parts/core/index.html
          Copy-Item 'luna mouth closed.png' build/parts/core/luna.png

      - name: Build Mira backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Companion --collect-all cv2 --collect-all imageio_ffmpeg mira-companion/backend.py
          Copy-Item dist/Mira-Companion.exe build/parts/core/Mira-Companion.exe

      - name: Add launcher and README
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Mira" /min Mira-Companion.exe
          timeout /t 4 /nobreak >nul
          start "Mira Chrome" chrome.exe --app=http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/parts/core/START-MIRA.bat
          @'
          Mira AI Companion - Local Ollama + OpenVoice V2

          Install Ollama for Windows and make sure qwen3:4b is installed.
          Put your permitted voice reference at:
          %APPDATA%\LunaGothicCompanion\voice_reference.wav

          Extract ALL downloaded Mira parts into the SAME folder before running START-MIRA.bat.
          Mira uses one visual reference image: luna.png.
          Each spoken reply creates a new MP4 using luna.png, OpenVoice V2 audio, and Python audio-driven animation.
          No faster-whisper or whisper-timestamped dependency is installed.
          '@ | Set-Content -Encoding UTF8 build/parts/core/README.txt

      - name: Distribute checkpoint files across small parts
        shell: pwsh
        run: |
          $files = Get-ChildItem -File -Recurse build/OpenVoice/checkpoints_v2 | Sort-Object FullName
          1..3 | ForEach-Object { New-Item -ItemType Directory -Force -Path "build/parts/part$_/checkpoints_v2" | Out-Null }
          $i = 0
          foreach ($f in $files) {
            $bucket = ($i % 3) + 1
            Copy-Item $f.FullName "build/parts/part$bucket/checkpoints_v2/$($f.Name)"
            $i++
          }
          1..3 | ForEach-Object {
            @"
          Mira OpenVoice V2 checkpoint part $_

          Extract this ZIP into the same Mira folder as the other parts.
          The files belong under checkpoints_v2.
          "@ | Set-Content -Encoding UTF8 "build/parts/part$_/README.txt"
          }

      - name: Create small ZIP downloads
        shell: pwsh
        run: |
          Compress-Archive -Path build/parts/core/* -DestinationPath Mira-Part1-Core.zip -Force
          Compress-Archive -Path build/parts/part1/* -DestinationPath Mira-Part2-Checkpoints.zip -Force
          Compress-Archive -Path build/parts/part2/* -DestinationPath Mira-Part3-Checkpoints.zip -Force
          Compress-Archive -Path build/parts/part3/* -DestinationPath Mira-Part4-Checkpoints.zip -Force
          Get-ChildItem Mira-Part*.zip | Select-Object Name,Length

      - name: Upload Part 1
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Part1-Core
          path: Mira-Part1-Core.zip
          retention-days: 14

      - name: Upload Part 2
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Part2-Checkpoints
          path: Mira-Part2-Checkpoints.zip
          retention-days: 14

      - name: Upload Part 3
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Part3-Checkpoints
          path: Mira-Part3-Checkpoints.zip
          retention-days: 14

      - name: Upload Part 4
        uses: actions/upload-artifact@v4
        with:
          name: Mira-Part4-Checkpoints
          path: Mira-Part4-Checkpoints.zip
          retention-days: 14
