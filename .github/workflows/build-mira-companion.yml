name: Build Mira Companion
on:
  workflow_dispatch:
  push:
    paths:
      - 'mira-companion/**'
      - 'openvoice/**'
      - 'luna mouth *.png'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mira-companion/requirements.txt
      - name: Install OpenVoice build dependencies
        run: |
          pip install pyinstaller
      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('myshell-ai/OpenVoiceV2', local_dir='build/openvoice/checkpoints_v2')"
      - name: Build OpenVoice worker EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name openvoice-server openvoice/server.py
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item dist/openvoice-server.exe build/package/openvoice-server.exe
          Copy-Item -Recurse build/openvoice/checkpoints_v2 build/package/checkpoints_v2
      - name: Build Mira backend EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Companion mira-companion/backend.py
          Copy-Item dist/Mira-Companion.exe build/package/Mira-Companion.exe
          Copy-Item 'mira-companion/index.html' build/package/index.html
          Copy-Item 'luna mouth closed.png' build/package/'luna mouth closed.png'
          Copy-Item 'luna mouth open.png' build/package/'luna mouth open.png'
      - name: Add launcher
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Mira Backend" /min Mira-Companion.exe
          timeout /t 2 /nobreak >nul
          start "Mira" http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/package/START-MIRA.bat
          @'
          MIRA AI COMPANION
          1. Put a short clean voice sample at:
             %APPDATA%\LunaGothicCompanion\voice_reference.wav
          2. Start START-MIRA.bat.
          3. Open Settings in the Chrome UI and enter your Anthropic API key.
          4. Chat with Mira or start a voice call.
          Mira generates an MP4 lip-sync animation from the OpenVoice audio using the two Luna mouth images.
          The character image files are the existing repo assets.
          '@ | Set-Content -Encoding UTF8 build/package/README.txt
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath Mira-AI-Companion-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows
          path: Mira-AI-Companion-Windows.zip
          retention-days: 14
