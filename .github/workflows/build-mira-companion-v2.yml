name: Build Mira Companion V2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mira-companion/requirements.txt
      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('myshell-ai/OpenVoiceV2', local_dir='build/openvoice/checkpoints_v2')"
      - name: Build OpenVoice worker
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --name openvoice-server --collect-all openvoice --collect-all melo --collect-all torch openvoice/server.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item dist/openvoice-server.exe build/package/openvoice-server.exe
          Copy-Item -Recurse build/openvoice/checkpoints_v2 build/package/checkpoints_v2
          Copy-Item 'mira-companion/index.html' build/package/index.html
          Copy-Item 'luna mouth closed.png' build/package/'luna mouth closed.png'
          Copy-Item 'luna mouth open.png' build/package/'luna mouth open.png'
      - name: Build Mira backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Companion --collect-all cv2 --collect-all imageio_ffmpeg mira-companion/backend.py
          Copy-Item dist/Mira-Companion.exe build/package/Mira-Companion.exe
      - name: Launcher and readme
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Mira" /min Mira-Companion.exe
          timeout /t 3 /nobreak >nul
          start "Mira Chrome UI" http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/package/START-MIRA.bat
          @'
          Mira AI Companion
          Start START-MIRA.bat.
          Enter your Anthropic API key in Settings.
          Put your permitted 5–15 second OpenVoice reference at:
          %APPDATA%\LunaGothicCompanion\voice_reference.wav
          Every Mira spoken response becomes an MP4 using the existing Luna closed/open mouth images and audio-driven lip-sync.
          When not in a voice call, Mira can proactively chat and surface saved memories.
          '@ | Set-Content -Encoding UTF8 build/package/README.txt
      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath Mira-AI-Companion-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows
          path: Mira-AI-Companion-Windows.zip
          retention-days: 14
