name: Build Mira Companion V3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: mira-companion/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r mira-companion/requirements.txt

      - name: Verify OpenVoice imports
        shell: pwsh
        run: |
          python -c "import torch, openvoice, melo, librosa, wavmark; print('OpenVoice stack OK'); print(torch.__version__)"

      - name: Download OpenVoice V2 checkpoints
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='myshell-ai/OpenVoiceV2', local_dir='build/openvoice/checkpoints_v2', local_dir_use_symlinks=False)"

      - name: Build OpenVoice worker
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name openvoice-server --collect-all openvoice --collect-all melo --collect-all librosa --collect-all wavmark --hidden-import=melo.api --hidden-import=openvoice.api --hidden-import=openvoice.se_extractor openvoice/server.py

      - name: Assemble package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item dist/openvoice-server.exe build/package/openvoice-server.exe
          Copy-Item -Recurse build/openvoice/checkpoints_v2 build/package/checkpoints_v2
          Copy-Item 'mira-companion/index.html' build/package/index.html
          # The existing closed-mouth Luna artwork is the single visual reference.
          Copy-Item 'luna mouth closed.png' build/package/luna.png

      - name: Build Mira backend
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name Mira-Companion --collect-all cv2 --collect-all imageio_ffmpeg --hidden-import=wave mira-companion/backend.py
          Copy-Item dist/Mira-Companion.exe build/package/Mira-Companion.exe

      - name: Create launcher and readme
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "Mira Backend" /min Mira-Companion.exe
          timeout /t 5 /nobreak >nul
          start "Mira Chrome UI" chrome.exe --app=http://127.0.0.1:8787/
          if errorlevel 1 start "Mira Chrome UI" http://127.0.0.1:8787/
          '@ | Set-Content -Encoding ASCII build/package/START-MIRA.bat
          @'
          Mira AI Companion - Windows

          Start START-MIRA.bat.
          Enter your Anthropic API key in Settings.
          Put a permitted 5-15 second OpenVoice reference at:
          %APPDATA%\LunaGothicCompanion\voice_reference.wav

          Mira uses ONE image only: luna.png.
          Each spoken reply generates a fresh MP4 from that image and the OpenVoice audio,
          with Python audio-driven animation. No second mouth image is required.
          Mira can proactively chat while you are away and stores conversation memories
          in the browser's local storage.
          '@ | Set-Content -Encoding UTF8 build/package/README.txt

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath Mira-AI-Companion-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira-AI-Companion-Windows-V3
          path: Mira-AI-Companion-Windows.zip
          retention-days: 14
