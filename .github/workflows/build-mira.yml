name: Build Mira EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build React + Tailwind frontend
        shell: pwsh
        run: |
          npm install
          npm run build
          if (!(Test-Path dist/index.html)) { throw "React build did not produce dist/index.html" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained EXE
        shell: pwsh
        run: dotnet publish Mira/Mira.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package required files
        shell: pwsh
        run: |
          if (!(Test-Path publish/Mira.exe)) { throw "Mira.exe was not produced" }
          Copy-Item "dist/*" "publish" -Recurse -Force
          Copy-Item "luna mouth closed.png" "publish/luna mouth closed.png" -Force
          if (!(Test-Path "publish/index.html")) { throw "React index.html was not copied" }
          if (!(Test-Path "publish/luna mouth closed.png")) { throw "luna mouth closed.png was not copied" }
      - name: Zip Windows app
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Mira-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Windows
          path: Mira-Windows.zip
