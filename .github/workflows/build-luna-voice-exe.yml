name: Build Luna Voice EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'luna-app/server.js'
      - 'luna-app/package.json'
      - 'luna-app/index.html'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-voice-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: luna-app/package.json
      - name: Install dependencies
        working-directory: luna-app
        run: npm install --no-audit --no-fund
      - name: Build Windows EXE
        working-directory: luna-app
        run: npx @yao-pkg/pkg@6.22.0 . --targets node22-win-x64 --output Luna-Backend.exe --compress Brotli
      - name: Verify EXE
        working-directory: luna-app
        run: |
          if (!(Test-Path Luna-Backend.exe)) { throw 'Luna-Backend.exe was not created.' }
      - name: Assemble release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item luna-app/Luna-Backend.exe release/Luna-Backend.exe
          Copy-Item luna-app/index.html release/index.html
          Copy-Item 'luna mouth closed.png' 'release/luna mouth closed.png'
          Set-Content release/README.txt @('LUNA VOICE APP - FASTER LIVEPORTRAIT','','1. Start the official FasterLivePortrait Windows all-in-one package and enable its API on http://127.0.0.1:9871.','','2. Double-click Luna-Backend.exe. Chrome opens automatically at http://127.0.0.1:8787.','','3. Enter and save your Deepgram API key.','','Pipeline: Microphone -> Deepgram Nova-3 STT -> Luna reply -> Deepgram Aura-2 TTS -> FasterLivePortrait/JoyVASA -> Chrome.','','No MuseTalk. No ffmpeg.wasm. No browser MP4 generation. Only luna mouth closed.png is used as the Luna source portrait.')
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath Luna-Voice-App.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Voice-App
          path: Luna-Voice-App.zip
          if-no-files-found: error
