name: Build Luna Voice EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'luna-app/server.js'
      - 'luna-app/package.json'
      - 'luna-app/index.html'
      - 'luna mouth closed.png'
      - '.github/workflows/build-luna-voice-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: luna-app/package.json

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: luna-app
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        working-directory: luna-app
        run: npx @yao-pkg/pkg@6.22.0 . --targets node22-win-x64 --output Luna-Backend.exe --compress Brotli

      - name: Verify EXE
        working-directory: luna-app
        run: |
          if (!(Test-Path 'Luna-Backend.exe')) { throw 'Luna-Backend.exe was not created.' }
          Get-Item 'Luna-Backend.exe' | Select-Object Name,Length

      - name: Assemble release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/luna-app | Out-Null
          Copy-Item 'luna-app/Luna-Backend.exe' 'release/Luna-Backend.exe'
          Copy-Item 'luna-app/index.html' 'release/luna-app/index.html'
          Copy-Item 'luna mouth closed.png' 'release/luna mouth closed.png'
          Set-Content -Path 'release/README.txt' -Value @(
            'LUNA VOICE APP'
            ''
            'Double-click Luna-Backend.exe. Chrome opens automatically.'
            ''
            'Pipeline: Microphone -> Deepgram Nova-3 STT -> Luna reply -> Deepgram Aura-2 MP3 -> MuseTalk 1.5 -> MP4 -> Chrome.'
            ''
            'Enter your Deepgram API key in Chrome. MuseTalk 1.5 is used through the public Hugging Face ZeroGPU Space; no Replicate token is required.'
            ''
            'Only luna mouth closed.png is used for Luna.'
          )

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path 'release/*' -DestinationPath 'Luna-Voice-App.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Voice-App
          path: Luna-Voice-App.zip
          if-no-files-found: error
