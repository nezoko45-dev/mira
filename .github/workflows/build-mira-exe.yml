name: Build Mira Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'index.html'
      - 'luna mouth closed.png'
      - 'luna mouth open.png'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend packages
        working-directory: backend
        run: npm install
      - name: Build MiraBackend.exe
        working-directory: backend
        run: npm run build:exe
      - name: Assemble Chrome package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Mira | Out-Null
          Copy-Item index.html dist\Mira\index.html
          Copy-Item 'luna mouth closed.png' dist\Mira\'luna mouth closed.png'
          Copy-Item 'luna mouth open.png' dist\Mira\'luna mouth open.png'
          Copy-Item backend\MiraBackend.exe dist\Mira\MiraBackend.exe
          New-Item -ItemType Directory -Force dist\Mira\generated | Out-Null
          @'
          Start-Process "$PSScriptRoot\MiraBackend.exe"
          Start-Sleep -Seconds 2
          Start-Process "http://127.0.0.1:47821/"
          '@ | Set-Content dist\Mira\Start-Mira.ps1
      - name: Zip Mira package
        shell: pwsh
        run: Compress-Archive -Path dist\Mira\* -DestinationPath dist\Mira-Chrome-EXE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Chrome-EXE
          path: dist\Mira-Chrome-EXE.zip
