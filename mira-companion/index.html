<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira — AI Companion</title><style>body{margin:0;background:#09070b;color:#f8edf5;font:15px system-ui,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:1.25fr .75fr;gap:16px;padding:16px;box-sizing:border-box}.card{background:#130d15;border:1px solid #382331;border-radius:22px;overflow:hidden}.stage{position:relative;min-height:760px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#30182d,#0b080d 65%)}#miraImg,#miraVideo{max-width:90%;max-height:78vh;border-radius:18px;object-fit:contain}#miraVideo{display:none}.speaking{filter:drop-shadow(0 0 28px #ef6cae88)}.top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;background:linear-gradient(#09070bdd,transparent)}.brand{font-weight:900;letter-spacing:.12em}.state{color:#b9a9b6;font-size:12px}.caption{position:absolute;bottom:20px;left:6%;right:6%;padding:12px;border-radius:14px;background:#09070be8;text-align:center}.side{padding:20px;display:flex;flex-direction:column}.messages{flex:1;min-height:430px;max-height:62vh;overflow:auto}.msg{padding:11px 13px;border-radius:15px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.you{background:#241823;margin-left:12%}.mira{background:#180f17;margin-right:8%}.controls{display:flex;gap:8px;margin-top:12px}.controls input{flex:1}.controls input,.controls button,.settings input{border:1px solid #503148;background:#0d0a0f;color:#eee;border-radius:11px;padding:11px}.controls button{background:#b34d8b;font-weight:800;cursor:pointer}.settings{margin-top:12px}.settings summary{cursor:pointer;font-weight:800}.settings div{display:grid;gap:8px;margin-top:10px}.small{color:#8f7e8d;font-size:12px}.memory{border-top:1px solid #382331;margin-top:14px;padding-top:12px}.memory button{background:#251724;color:#ddd;border:1px solid #503148;border-radius:10px;padding:9px;cursor:pointer}.call{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#ef6cae;color:white;font-weight:900;cursor:pointer}.call.active{background:#593044}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{min-height:65vh}.messages{max-height:400px}}</style></head><body><div class="app"><section class="card stage"><div class="top"><div class="brand">MIRA 🖤</div><div id="state" class="state">Starting…</div></div><img id="miraImg" src="/asset/mira"><video id="miraVideo" playsinline></video><div id="caption" class="caption">Mira is waking up…</div></section><aside class="card side"><h1>Mira</h1><div class="small">AI companion • chat, memories, voice calls, generated lip-sync video</div><div id="messages" class="messages"></div><div class="controls"><input id="text" placeholder="Talk to Mira…"><button id="send">Send</button></div><button id="call" class="call">☎ Start voice call</button><details class="settings"><summary>⚙ Settings</summary><div><label>Anthropic API key<input id="key" type="password" placeholder="sk-ant-…"></label><span class="small">Claude powers Mira's conversation. The key is sent only to your local backend.</span></div></details><div class="memory"><b>Memory</b><div id="memoryText" class="small">No saved memories yet.</div><button id="clear">Clear memories</button></div></aside></div><script>const $=x=>document.getElementById(x);let messages=JSON.parse(localStorage.getItem('miraMessages')||'[]'),memories=JSON.parse(localStorage.getItem('miraMemories')||'[]'),call=false,recognition=null;function render(){const box=$('messages');box.innerHTML='';messages.slice(-60).forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'you':'mira');d.textContent=m.role==='user'?'You: '+m.text:'Mira: '+m.text;box.appendChild(d)});box.scrollTop=box.scrollHeight;$('memoryText').textContent=memories.length?memories.slice(-8).map(x=>'• '+x).join('\n'):'No saved memories yet.'}function save(){localStorage.setItem('miraMessages',JSON.stringify(messages.slice(-60)));localStorage.setItem('miraMemories',JSON.stringify(memories.slice(-30)));render()}async function api(path,data){const r=await fetch('/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Backend error');return d}function showVideo(b64){if(!b64)return;$('miraImg').style.display='none';const v=$('miraVideo');v.src='data:video/mp4;base64,'+b64;v.style.display='block';v.classList.add('speaking');v.onended=()=>{v.style.display='none';v.removeAttribute('src');$('miraImg').style.display='block';v.classList.remove('speaking');$('state').textContent=call?'Call listening':'Mira is here'};v.play().catch(()=>{})}async function talk(text,proactive=false){if(!text&&!proactive)return;if(!proactive){messages.push({role:'user',text});save()}$('state').textContent='Thinking…';try{const d=await api(proactive?'proactive':'chat',{text,history:messages,key:$('key').value,memories});messages.push({role:'assistant',text:d.reply});if(d.memory)memories.push(d.memory);save();$('caption').textContent=d.reply;$('state').textContent=call?'Call listening':'Mira is here';showVideo(d.video_base64);if(d.voice_error)$('caption').textContent+='\n[Voice: '+d.voice_error+']'}catch(e){$('state').textContent='Error';$('caption').textContent=e.message}}$('send').onclick=()=>{const t=$('text').value.trim();if(t){$('text').value='';talk(t)}};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('clear').onclick=()=>{memories=[];save()};function setupRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('caption').textContent='This Chrome build does not provide speech recognition.';return null}const r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)talk(e.results[i][0].transcript)};r.onerror=e=>$('caption').textContent='Call microphone error: '+e.error;r.onend=()=>{if(call)try{r.start()}catch{}};return r}$('call').onclick=()=>{call=!call;$('call').textContent=call?'■ End voice call':'☎ Start voice call';$('call').classList.toggle('active',call);if(call){recognition=setupRecognition();if(recognition)try{recognition.start();$('state').textContent='Call listening';$('caption').textContent='Mira is listening…'}catch(e){$('caption').textContent=e.message}}else{try{recognition?.stop()}catch{}recognition=null;$('state').textContent='Mira is here';$('caption').textContent='Call ended.'}};setInterval(()=>{if(!call&&document.visibilityState==='visible')talk('',true)},180000);render();$('state').textContent='Mira is here';</script></body></html>
