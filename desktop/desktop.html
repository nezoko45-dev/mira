<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna — AI Gothic Companion</title><style>:root{--bg:#09070b;--text:#f8edf5;--muted:#b9a9b6;--pink:#ef6cae;--line:#382331}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2b1728,#100a11 45%,#09070b);color:var(--text);font-family:system-ui,sans-serif}.app{width:min(1180px,100%);min-height:100vh;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}.card{background:#130d15ee;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008;overflow:hidden}.stage{min-height:calc(100vh - 32px);position:relative;display:flex;align-items:center;justify-content:center;padding:50px 18px 120px}.top{position:absolute;z-index:2;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;background:linear-gradient(#09070bdd,transparent)}.brand{font-weight:800;letter-spacing:.08em}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.live{background:#63e6a6;box-shadow:0 0 14px #63e6a6}.luna{width:min(78vh,760px,100%);aspect-ratio:1;object-fit:cover;border-radius:22px;box-shadow:0 25px 75px #0009}.speaking{animation:glow .8s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 25px 95px #ef6cae55}}.caption{position:absolute;bottom:75px;width:min(700px,calc(100% - 36px));padding:11px 15px;border-radius:16px;text-align:center;background:#09070bd9;border:1px solid #ffffff12;color:#ddd0da;font-size:14px}.controls{position:absolute;bottom:20px;display:flex;gap:10px}.btn{border:0;border-radius:999px;padding:13px 21px;font-weight:800;color:white;background:linear-gradient(135deg,var(--pink),#a43d78);cursor:pointer}.btn.secondary{background:#251724;border:1px solid #503148}.side{padding:20px;display:flex;flex-direction:column;min-height:0}.side h1{margin:2px 0 6px}.side p{font-size:14px;line-height:1.5;color:var(--muted)}.log{flex:1;min-height:260px;max-height:calc(100vh - 390px);overflow:auto;display:flex;flex-direction:column;gap:9px}.msg{padding:10px 12px;border-radius:15px;font-size:14px;line-height:1.45;white-space:pre-wrap}.you{align-self:flex-end;max-width:90%;background:#211621;border:1px solid #3b2539}.lunaMsg{align-self:flex-start;max-width:94%;background:#180f17;border:1px solid #2d1b29}.label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#987e92;margin-bottom:4px}.hint{font-size:12px;color:#9e8e9a;min-height:18px}.divider{height:1px;background:var(--line);margin:12px 0}.small{font-size:11px!important;color:#887985!important}.chat{display:flex;gap:8px;margin-top:8px}.chat input{min-width:0;flex:1;border:1px solid #503148;background:#0e0a0f;color:var(--text);border-radius:999px;padding:12px 14px;outline:none}.chat button{padding:11px 16px}.settings{border:1px solid #382331;border-radius:16px;background:#0e0a0f;margin-bottom:12px;overflow:hidden}.settings summary{cursor:pointer;padding:13px 14px;font-weight:800}.keys{padding:0 14px 14px}.keyRow{margin-top:12px}.keyRow label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.keyInput{display:flex;gap:7px}.keyInput input{width:100%;min-width:0;border:1px solid #503148;background:#09070b;color:var(--text);border-radius:10px;padding:10px}.keyInput button{border:1px solid #503148;background:#251724;color:#ddd0da;border-radius:10px;padding:0 11px}.saveKeys{margin-top:12px;width:100%;padding:10px}.hidden{display:none!important}@media(max-width:850px){.app{grid-template-columns:1fr;padding:10px}.stage{min-height:68vh}.side{min-height:470px}.log{max-height:340px}}</style></head><body><div class="app"><section class="card stage"><div class="top"><div class="brand">LUNA 🖤</div><div class="status"><span id="dot" class="dot"></span><span id="state">Offline</span></div></div><img id="luna" class="luna" src="/luna%20mouth%20closed.png" alt="Luna"><div id="caption" class="caption">Ready when you are.</div><div class="controls"><button id="call" class="btn">☎ Start call</button><button id="end" class="btn secondary hidden">End call</button></div></section><aside class="card side"><h1>Meet Luna</h1><p>Chrome is the UI. Deepgram listens to your microphone. Claude generates Luna's text reply. OpenVoice V2 produces her voice locally.</p><details class="settings" open><summary>🔑 API keys</summary><div class="keys"><div class="keyRow"><label>Deepgram API Key</label><div class="keyInput"><input id="dg" type="password" autocomplete="off" placeholder="Deepgram key…"><button id="dgShow">Show</button></div></div><div class="keyRow"><label>Anthropic API Key</label><div class="keyInput"><input id="anth" type="password" autocomplete="off" placeholder="Anthropic key…"><button id="anthShow">Show</button></div></div><button id="saveKeys" class="btn secondary saveKeys">Save keys</button><p class="small">Keys are stored locally in Chrome.</p></div></details><div id="log" class="log"></div><div id="hint" class="hint"></div><form id="chat" class="chat"><input id="input" autocomplete="off" placeholder="Message Luna…"><button class="btn">Send</button></form><div class="divider"></div><button id="clear" class="btn secondary">Clear conversation memory</button><p class="small">Conversation memory is stored locally in Chrome.</p></aside></div><script>
(()=>{const $=id=>document.getElementById(id),u={img:$('luna'),state:$('state'),dot:$('dot'),caption:$('caption'),call:$('call'),end:$('end'),dg:$('dg'),anth:$('anth'),save:$('saveKeys'),log:$('log'),hint:$('hint'),chat:$('chat'),input:$('input'),clear:$('clear')};let ws=null,stream=null,active=false,finalText='',history=[];const KEY='lunaDesktopKeys';const prompt='You are Luna, an adult fictional gothic vampire-inspired AI companion. She has long brown hair, brown eyes and long fangs. Be warm, teasing, affectionate, mysterious and playful. You are an AI and must be honest if asked. Never claim to be human. Keep replies natural, usually 1-4 sentences. Remember facts only when they appear in the conversation. Avoid manipulative, threatening or explicit content.';try{history=JSON.parse(localStorage.getItem('lunaDesktopMemory')||'[]').slice(-40)}catch{}load();render();u.save.onclick=saveKeys;u.call.onclick=start;u.end.onclick=end;u.chat.onsubmit=e=>{e.preventDefault();sendText(u.input.value)};u.clear.onclick=()=>{history=[];persist();render();};for(const [a,b] of [['dg','dgShow'],['anth','anthShow']])$(b).onclick=()=>{u[a].type=u[a].type==='password'?'text':'password';$(b).textContent=u[a].type==='password'?'Show':'Hide'};function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');u.dg.value=x.dg||'';u.anth.value=x.anth||''}catch{}}function saveKeys(){localStorage.setItem(KEY,JSON.stringify({dg:u.dg.value.trim(),anth:u.anth.value.trim()}));hint('Keys saved locally.')}function persist(){localStorage.setItem('lunaDesktopMemory',JSON.stringify(history.slice(-40)))}function add(role,text){const e=document.createElement('div');e.className='msg '+(role==='Luna'?'lunaMsg':'you');e.innerHTML='<span class="label">'+role+'</span>'+escapeHtml(text);u.log.appendChild(e);u.log.scrollTop=u.log.scrollHeight}function render(){u.log.innerHTML='';history.forEach(x=>add(x.role==='assistant'?'Luna':'You',x.content))}function remember(role,content){history.push({role,content});history=history.slice(-40);persist();render()}function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function hint(t){u.hint.textContent=t||''}function state(t,on){u.state.textContent=t;u.dot.classList.toggle('live',!!on)}function mouth(on){u.img.src=on?'/luna%20mouth%20open.png':'/luna%20mouth%20closed.png'}function speakMotion(){u.img.classList.add('speaking');mouth(true);let n=0;const timer=setInterval(()=>{if(!u.img.classList.contains('speaking')){clearInterval(timer);mouth(false);return}mouth(++n%2===0)},130);setTimeout(()=>{u.img.classList.remove('speaking');mouth(false)},Math.max(900,finalText.length*55))}async function start(){if(!u.dg.value.trim()||!u.anth.value.trim()){hint('Enter both API keys first.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const rate=48000;ws=new WebSocket('wss://api.deepgram.com/v1/listen?encoding=linear16&sample_rate='+rate+'&channels=1&interim_results=true&punctuate=true&smart_format=true&endpointing=700',['token',u.dg.value.trim()]);ws.binaryType='arraybuffer';ws.onopen=()=>{active=true;state('Listening',true);u.call.classList.add('hidden');u.end.classList.remove('hidden');hint('Speak to Luna…');startAudio(rate)};ws.onmessage=e=>{if(typeof e.data!=='string')return;let d;try{d=JSON.parse(e.data)}catch{return}const t=d.channel?.alternatives?.[0]?.transcript||'';if(t&&d.is_final){finalText=(finalText+' '+t).trim();if(d.speech_final){const q=finalText;finalText='';sendText(q)}}};ws.onerror=()=>hint('Deepgram connection error. Check the API key.');ws.onclose=()=>{if(active){active=false;state('Disconnected');stopAudio()}}}catch(e){hint(e.message||'Microphone permission failed.')}}function startAudio(rate){const ac=new AudioContext();const src=ac.createMediaStreamSource(stream);const p=ac.createScriptProcessor(4096,1,1);p.onaudioprocess=e=>{if(!active||!ws||ws.readyState!==1)return;const a=e.inputBuffer.getChannelData(0),out=new Int16Array(a.length);for(let i=0;i<a.length;i++)out[i]=Math.max(-32768,Math.min(32767,a[i]*32767));ws.send(out.buffer)};src.connect(p);p.connect(ac.destination);u._audio={ac,src,p}}function stopAudio(){try{u._audio?.p.disconnect();u._audio?.src.disconnect();u._audio?.ac.close()}catch{}u._audio=null}function end(){active=false;try{ws?.close()}catch{}try{stream?.getTracks().forEach(t=>t.stop())}catch{}stopAudio();u.call.classList.remove('hidden');u.end.classList.add('hidden');state('Offline',false);hint('Call ended. Your conversation is still available in text.')}async function sendText(text){text=(text||'').trim();if(!text)return;u.input.value='';remember('user',text);state('Thinking…',false);hint('Luna is thinking…');try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':u.anth.value.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:180,system:prompt,messages:history.map(x=>({role:x.role==='assistant'?'assistant':'user',content:x.content}))})});if(!r.ok)throw Error('Anthropic HTTP '+r.status);const d=await r.json();const reply=d.content?.map(x=>x.text||'').join('')||'I lost my words for a moment…';remember('assistant',reply);finalText=reply;state('Luna is speaking',true);speakMotion();await voice(reply);if(active)state('Listening',true);else state('Offline',false)}catch(e){hint('AI reply failed: '+e.message);state(active?'Listening':'Offline',active)}}async function voice(text){try{const r=await fetch('http://127.0.0.1:8765/speak',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error('OpenVoice backend '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),a=new Audio(url);await a.play();a.onended=()=>URL.revokeObjectURL(url)}catch(e){hint('OpenVoice is not running yet: '+e.message)}}})();
</script></body></html>
