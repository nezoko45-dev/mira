<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna - Chrome Only</title><style>body{margin:0;background:#09070b;color:#fff;font:16px system-ui;display:grid;grid-template-columns:1fr 360px;min-height:100vh}.stage{display:grid;place-items:center;background:radial-gradient(circle,#3a1b36,#09070b 70%)}img{max-width:85%;max-height:85vh;border-radius:18px;transition:.2s}.speaking img{transform:scale(1.02);filter:drop-shadow(0 0 30px #d65caa)}aside{padding:20px;background:#130d16}input,button{padding:12px;border-radius:10px;border:1px solid #54334e;margin-top:8px}input{width:70%;background:#09070b;color:#fff}button{background:#b34e8c;color:#fff;font-weight:700}.messages{height:60vh;overflow:auto}.msg{padding:10px;margin:8px;border-radius:12px;background:#20131d}.you{background:#30202b}</style></head><body><section id="stage" class="stage"><img id="luna" src="../luna mouth closed.png"></section><aside><h1>Luna</h1><p>Chrome-only JavaScript. No EXE, Node, Python, server, or API key.</p><div id="messages" class="messages"></div><input id="text" placeholder="Talk to Luna"><button id="send">Speak</button><button id="call">Start voice call</button><p id="status">Ready</p></aside><script>const $=x=>document.getElementById(x);let chat=JSON.parse(localStorage.getItem('lunaChat')||'[]'),call=false,rec=null;function draw(){messages.innerHTML=chat.map(x=>`<div class="msg ${x.u?'you':''}"><b>${x.u?'You':'Luna'}:</b> ${x.t}</div>`).join('');messages.scrollTop=messages.scrollHeight}function reply(t){t=t.trim();if(!t)return;chat.push({u:1,t});let r=/^(hi|hello|hey)\b/i.test(t)?'Mhm… hello. I was waiting for you.':/how are you/i.test(t)?'I am doing nicely now that you are talking to me.':/love|miss you/i.test(t)?'Stay with me a little longer.':/bye|goodbye/i.test(t)?'Come back when you want to talk again.':'I heard you. Tell me more about that.';chat.push({t:r});localStorage.setItem('lunaChat',JSON.stringify(chat.slice(-60)));draw();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(r);u.rate=.95;u.pitch=1.05;u.onstart=()=>{$('stage').classList.add('speaking');$('status').textContent='Luna is speaking…'};u.onend=()=>{$('stage').classList.remove('speaking');$('status').textContent=call?'Listening…':'Ready'};speechSynthesis.speak(u)}$('send').onclick=()=>{let t=$('text').value;$('text').value='';reply(t)};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Chrome speech recognition is unavailable';return}rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{$('status').textContent='Listening…'};rec.onresult=e=>reply(e.results[0][0].transcript);rec.onend=()=>{rec=null;if(call)setTimeout(listen,300)};rec.onerror=()=>{rec=null;if(call)setTimeout(listen,700)};try{rec.start()}catch{}}$('call').onclick=()=>{call=!call;$('call').textContent=call?'End voice call':'Start voice call';if(call)listen();else{try{rec?.stop()}catch{}speechSynthesis.cancel();$('stage').classList.remove('speaking');$('status').textContent='Ready'}};draw();</script></body></html>
