<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira — Luna</title><style>body{margin:0;background:#07050a;color:#fff;font:16px system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:100vh}.stage{display:grid;place-items:center;min-height:100vh;background:radial-gradient(circle at 50% 40%,#3d183b,#07050a 72%)}#canvas{max-width:90vw;max-height:92vh;border-radius:20px;box-shadow:0 0 30px #6b287f}aside{padding:22px;background:#120b16;border-left:1px solid #2b1735;display:flex;flex-direction:column;gap:10px}h1{color:#e7a8ff}.messages{flex:1;overflow:auto}.msg{padding:10px;margin:8px 0;border:1px solid #33203d;border-radius:12px;background:#1d1020}.you{background:#2a1730}input,button{font:inherit;padding:12px;border-radius:11px;border:1px solid #4b2860}input{background:#09070c;color:#fff}button{background:#c45cff;color:#fff;font-weight:700}.secondary{background:#211127!important}.status{padding:10px;border:1px solid #33203d;border-radius:11px;background:#0c0810;color:#e7bfff}</style></head><body><section class="stage"><canvas id="canvas" aria-label="Luna gothic vampire companion"></canvas></section><aside><h1>Mira ♡</h1><div>Luna — gothic vampire companion</div><p>Chrome-only. This uses the exact vampire demon portrait stored in the Mira repo.</p><div id="messages" class="messages"></div><input id="text" placeholder="Talk to Luna" autocomplete="off"><button id="send">Speak</button><button id="call" class="secondary">Start voice call</button><div id="status" class="status">Loading Luna…</div></aside><script>const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d");let speaking=false,call=false,rec=null,raf=0,phase=0,chat=JSON.parse(localStorage.getItem("lunaChat")||"[]");const img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw(0);$("status").textContent="Luna ready"};img.onerror=()=>$("status").textContent="Could not load vampire demon.jpg";img.src="../vampire demon.jpg";function draw(a){if(!img.complete||!img.naturalWidth)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);if(a>0){ctx.save();ctx.globalAlpha=.12+.25*a;ctx.fillStyle="#16070e";ctx.beginPath();ctx.ellipse(canvas.width*.52,canvas.height*.73,canvas.width*.12*(.7+a),canvas.height*.035*(.6+a),0,0,Math.PI*2);ctx.fill();ctx.restore()}}function anim(){if(!speaking){raf=0;draw(0);return}phase+=.2;draw((Math.sin(phase)+1)/2);raf=requestAnimationFrame(anim)}function say(t){t=t.trim();if(!t)return;chat.push({u:1,t});let r=/^(hi|hello|hey)\b/i.test(t)?"Mhm… hello. I was waiting for you.":/how are you/i.test(t)?"I am doing nicely now that you are talking to me.":/love|miss you/i.test(t)?"Stay with me a little longer.":/bye|goodbye/i.test(t)?"Come back when you want to talk again.":"I heard you. Tell me more about that.";chat.push({t:r});localStorage.setItem("lunaChat",JSON.stringify(chat.slice(-60)));render();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r);u.rate=.94;u.pitch=1.04;u.onstart=()=>{speaking=true;$("status").textContent="Luna is speaking…";if(!raf)raf=requestAnimationFrame(anim)};u.onend=()=>{speaking=false;$("status").textContent=call?"Listening…":"Ready";if(call)setTimeout(listen,350)};u.onerror=()=>{speaking=false};speechSynthesis.speak(u)}function render(){$("messages").innerHTML=chat.map(x=>`<div class="msg ${x.u?'you':''}"><b>${x.u?'You':'Luna'}:</b> ${String(x.t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`).join("");$("messages").scrollTop=$("messages").scrollHeight}function listen(){if(!call||rec)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("status").textContent="Chrome speech recognition unavailable";return}rec=new SR();rec.lang="en-US";rec.continuous=false;rec.interimResults=false;rec.onstart=()=>$("status").textContent="Listening…";rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||"";rec=null;say(t)};rec.onend=()=>{rec=null;if(call&&!speechSynthesis.speaking)setTimeout(listen,450)};rec.onerror=()=>{rec=null;if(call)setTimeout(listen,900)};try{rec.start()}catch{rec=null}}$("send").onclick=()=>{const t=$("text").value;$("text").value="";say(t)};$("text").onkeydown=e=>{if(e.key==="Enter")$("send").click()};$("call").onclick=()=>{call=!call;$("call").textContent=call?"End voice call":"Start voice call";if(call)listen();else{try{rec?.stop()}catch{}rec=null;speechSynthesis.cancel();speaking=false;draw(0);$("status").textContent="Ready"}};render();</script></body></html>
