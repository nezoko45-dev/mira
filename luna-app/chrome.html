<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luna - Chrome Only</title>
<style>
:root{--bg:#09070b;--panel:#130d16;--card:#20131d;--accent:#b34e8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100vh}
.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#3a1b36 0,#09070b 70%)}
.luna-wrap{position:relative;width:min(85vw,760px);height:min(88vh,900px);display:grid;place-items:center}
#canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:18px;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 0 8px rgba(214,92,170,.12));will-change:filter}
.luna-wrap.speaking #canvas{filter:drop-shadow(0 0 22px rgba(214,92,170,.45))}
.luna-wrap.blink #canvas{transform:scaleY(.997)}
aside{padding:20px;background:var(--panel);border-left:1px solid #2a1928;display:flex;flex-direction:column;min-height:100vh}h1{margin-top:0}
.messages{height:60vh;overflow:auto;padding-right:4px}.msg{padding:10px;margin:8px 0;border-radius:12px;background:var(--card);line-height:1.4}.you{background:#30202b}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #54334e;margin-top:8px}input{width:100%;background:#09070b;color:#fff;outline:none}button{background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.status{margin-top:12px;opacity:.8}
@media(max-width:760px){body{grid-template-columns:1fr}.stage{min-height:65vh}aside{min-height:auto;border-left:0;border-top:1px solid #2a1928}.messages{height:28vh}.luna-wrap{width:94vw;height:62vh}}
</style>
</head>
<body>
<section id="stage" class="stage"><div id="lunaWrap" class="luna-wrap"><canvas id="canvas" aria-label="Animated Luna"></canvas></div></section>
<aside><h1>Luna</h1><p>Chrome-only Luna. Her image is split into pixels and the pixels matching her mouth shape animate while she speaks.</p><div id="messages" class="messages"></div><input id="text" autocomplete="off" placeholder="Talk to Luna"><button id="send">Speak</button><button id="call">Start voice call</button><div id="status" class="status">Finding Luna image…</div></aside>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let source=null,chat=JSON.parse(localStorage.getItem('lunaChat')||'[]'),call=false,rec=null,blinkTimer=null,animId=0,speaking=false,talkPhase=0;
const MOUTH={x:.50,y:.66,w:.22,h:.095};
const IMAGE_CANDIDATES=['../luna mouth closed.png','./luna mouth closed.png','../luna-app/luna mouth closed.png','https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna%20mouth%20closed.png','https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna-app/luna%20mouth%20closed.png'];
let imageIndex=0;

// The source stays untouched. We copy it into an offscreen pixel buffer once,
// then rebuild the mouth from individual pixels on every animation frame.
let basePixels=null,mouthPixels=[],mouthBounds=null,pixelSize=2;

function findLunaImage(){
 if(imageIndex>=IMAGE_CANDIDATES.length){$('status').textContent='Could not find luna mouth closed.png';return}
 const test=new Image();
 test.crossOrigin='anonymous';
 test.onload=()=>{source=test;canvas.width=test.naturalWidth;canvas.height=test.naturalHeight;preparePixels();drawFrame(0);$('status').textContent='Luna ready';startBlinkLoop()};
 test.onerror=()=>{imageIndex++;findLunaImage()};test.src=IMAGE_CANDIDATES[imageIndex++];
}
findLunaImage();

function preparePixels(){
 const w=canvas.width,h=canvas.height;
 const off=document.createElement('canvas');off.width=w;off.height=h;const oc=off.getContext('2d');
 try{oc.drawImage(source,0,0,w,h);basePixels=oc.getImageData(0,0,w,h)}catch(e){basePixels=null;return}
 const x0=Math.max(0,Math.floor(w*(MOUTH.x-MOUTH.w/2))),y0=Math.max(0,Math.floor(h*(MOUTH.y-MOUTH.h/2)));
 const x1=Math.min(w,Math.ceil(w*(MOUTH.x+MOUTH.w/2))),y1=Math.min(h,Math.ceil(h*(MOUTH.y+MOUTH.h/2)));
 const found=[];
 // Build a mouth-shaped mask from the actual pixels in the mouth region.
 // Dark/red pixels are retained, while skin-colored pixels are allowed to move
 // only near the mouth contour. This makes the animation follow Luna's real mouth.
 for(let y=y0;y<y1;y+=pixelSize){
   for(let x=x0;x<x1;x+=pixelSize){
     const i=(y*w+x)*4,r=basePixels.data[i],g=basePixels.data[i+1],b=basePixels.data[i+2],a=basePixels.data[i+3];
     if(!a)continue;
     const dark=(r+g+b)/3<118;
     const red=r>g*1.12 && r>b*1.08 && r>75;
     const contour=dark||red;
     const dx=(x+w*.0)-w*MOUTH.x,dy=y-h*MOUTH.y;
     const ellipse=(dx*dx)/Math.pow(w*MOUTH.w*.48,2)+(dy*dy)/Math.pow(h*MOUTH.h*.52,2)<=1;
     if(contour&&ellipse)found.push({x,y,r,g,b,a,dx,dy});
   }
 }
 mouthPixels=found;
 mouthBounds={x0,y0,x1,y1};
 // If the artwork is light enough that the color mask finds very little,
 // fall back to the center of the mouth so animation still visibly works.
 if(mouthPixels.length<8){
   mouthPixels=[];
   for(let y=y0;y<y1;y+=pixelSize)for(let x=x0;x<x1;x+=pixelSize){
     const i=(y*w+x)*4;mouthPixels.push({x,y,r:basePixels.data[i],g:basePixels.data[i+1],b:basePixels.data[i+2],a:basePixels.data[i+3],dx:x-w*MOUTH.x,dy:y-h*MOUTH.y});
   }
 }
}

function drawBase(){
 if(!source)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.imageSmoothingEnabled=true;ctx.drawImage(source,0,0,canvas.width,canvas.height);
}

function drawFrame(open){
 if(!source||!basePixels)return;
 drawBase();
 const w=canvas.width,h=canvas.height,amount=Math.max(0,Math.min(1,open));
 // Pixel animation: each selected mouth pixel is moved according to its
 // position inside the real mouth shape. The center opens the most; edges
 // stay anchored, producing an actual mouth-shaped deformation.
 ctx.imageSmoothingEnabled=false;
 const vertical=Math.round(h*.040*amount),spread=Math.round(w*.012*amount);
 for(const p of mouthPixels){
   const nx=(p.x-w*MOUTH.x)/(w*MOUTH.w*.5);
   const ny=(p.y-h*MOUTH.y)/(h*MOUTH.h*.5);
   const edge=Math.min(1,Math.abs(nx));
   const weight=Math.max(0,1-edge*.78);
   let dy=0;
   if(ny<0)dy=-Math.round(vertical*weight*(.65+.35*(-ny)));
   else dy=Math.round(vertical*weight*(.65+.35*ny));
   const dx=Math.round(spread*nx*weight);
   const sx=Math.max(0,Math.min(w-1,p.x)),sy=Math.max(0,Math.min(h-1,p.y));
   const sw=Math.min(pixelSize,w-sx),sh=Math.min(pixelSize,h-sy);
   const destX=sx+dx,destY=sy+dy;
   if(destX<0||destY<0||destX>=w||destY>=h)continue;
   const ix=(sy*w+sx)*4;
   ctx.fillStyle=`rgba(${basePixels.data[ix]},${basePixels.data[ix+1]},${basePixels.data[ix+2]},${basePixels.data[ix+3]/255})`;
   ctx.fillRect(destX,destY,sw,sh);
 }
 // Create a small opening from pixels belonging to the mouth shape instead of
 // painting a generic rectangle over Luna's face.
 if(amount>.12){
   const openH=Math.max(1,Math.round(h*.010+ h*.035*amount));
   const openW=Math.round(w*MOUTH.w*(.34+.28*amount));
   const ox=Math.round(w*MOUTH.x-openW/2),oy=Math.round(h*MOUTH.y-openH/2);
   ctx.save();ctx.globalAlpha=.30+.35*amount;ctx.fillStyle='#10070d';
   for(let yy=0;yy<openH;yy+=pixelSize)for(let xx=0;xx<openW;xx+=pixelSize)ctx.fillRect(ox+xx,oy+yy,Math.min(pixelSize,openW-xx),Math.min(pixelSize,openH-yy));
   ctx.restore();
 }
 // A faint pixel-grid shimmer only over the mouth makes the individual-pixel
 // movement visible without turning the entire portrait into a blocky filter.
 if(amount>.05){
   ctx.save();ctx.globalAlpha=.055*amount;ctx.strokeStyle='#fff';ctx.lineWidth=1;
   const gx=Math.max(1,Math.floor(w*MOUTH.w/18)),gy=Math.max(1,Math.floor(h*MOUTH.h/8));
   for(let x=Math.floor(w*(MOUTH.x-MOUTH.w/2));x<w*(MOUTH.x+MOUTH.w/2);x+=gx){ctx.beginPath();ctx.moveTo(x,h*(MOUTH.y-MOUTH.h/2));ctx.lineTo(x,h*(MOUTH.y+MOUTH.h/2));ctx.stroke()}
   for(let y=Math.floor(h*(MOUTH.y-MOUTH.h/2));y<h*(MOUTH.y+MOUTH.h/2);y+=gy){ctx.beginPath();ctx.moveTo(w*(MOUTH.x-MOUTH.w/2),y);ctx.lineTo(w*(MOUTH.x+MOUTH.w/2),y);ctx.stroke()}
   ctx.restore();
 }
}

function animateMouth(){
 if(!speaking){animId=0;drawFrame(0);return}
 talkPhase+=.18;
 const a=(Math.sin(talkPhase)+1)/2;
 const b=(Math.sin(talkPhase*2.47+1.1)+1)/2;
 const c=(Math.sin(talkPhase*.73)+1)/2;
 const open=Math.min(1,.05+.58*Math.pow(a,2)+.30*b*.65+.10*c);
 drawFrame(open);animId=requestAnimationFrame(animateMouth);
}
function setSpeaking(on){speaking=on;$('lunaWrap').classList.toggle('speaking',on);$('status').textContent=on?'Luna is speaking…':(call?'Listening…':'Ready');if(on&&!animId){talkPhase=0;animId=requestAnimationFrame(animateMouth)}}
function draw(){ $('messages').innerHTML=chat.map(x=>`<div class="msg ${x.u?'you':''}"><b>${x.u?'You':'Luna'}:</b> ${escapeHtml(x.t)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight }
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function startBlinkLoop(){clearTimeout(blinkTimer);blinkTimer=setTimeout(()=>{if(!speaking){$('lunaWrap').classList.add('blink');setTimeout(()=>$('lunaWrap').classList.remove('blink'),140)}startBlinkLoop()},3500+Math.random()*3500)}
function reply(t){t=t.trim();if(!t)return;chat.push({u:1,t});let r=/^(hi|hello|hey)\b/i.test(t)?'Mhm… hello. I was waiting for you.':/how are you/i.test(t)?'I am doing nicely now that you are talking to me.':/love|miss you/i.test(t)?'Stay with me a little longer.':/bye|goodbye/i.test(t)?'Come back when you want to talk again.':'I heard you. Tell me more about that.';chat.push({t:r});localStorage.setItem('lunaChat',JSON.stringify(chat.slice(-60)));draw();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r);u.rate=.95;u.pitch=1.05;u.onstart=()=>setSpeaking(true);u.onend=()=>{setSpeaking(false);if(call)setTimeout(listen,300)};u.onerror=()=>setSpeaking(false);speechSynthesis.speak(u)}
$('send').onclick=()=>{const t=$('text').value;$('text').value='';reply(t)};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
function listen(){if(!call)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Chrome speech recognition is unavailable';return}if(rec)return;rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>$('status').textContent='Listening…';rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';rec=null;reply(t)};rec.onend=()=>{rec=null;if(call&&!speechSynthesis.speaking)setTimeout(listen,500)};rec.onerror=()=>{rec=null;if(call)setTimeout(listen,900)};try{rec.start()}catch{rec=null;if(call)setTimeout(listen,900)}}
$('call').onclick=()=>{call=!call;$('call').textContent=call?'End voice call':'Start voice call';if(call)listen();else{try{rec?.stop()}catch{}rec=null;speechSynthesis.cancel();setSpeaking(false);$('status').textContent='Ready'}};
draw();
</script>
</body>
</html>
