<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira — Luna</title><style>:root{--bg:#07050a;--panel:#120b16;--card:#1d1020;--accent:#c45cff;--line:#4b2860}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:100vh}.stage{display:grid;place-items:center;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3d183b,#07050a 72%)}.luna-wrap{position:relative;width:min(86vw,800px);height:94vh;display:grid;place-items:center}.luna-wrap:after{content:'';position:absolute;inset:7%;border-radius:24px;pointer-events:none;box-shadow:0 0 55px rgba(196,92,255,.12)}#canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:20px;filter:drop-shadow(0 0 18px rgba(196,92,255,.18))}.speaking #canvas{filter:drop-shadow(0 0 28px rgba(196,92,255,.48))}aside{padding:22px;background:var(--panel);border-left:1px solid #2b1735;display:flex;flex-direction:column;gap:10px}h1{margin:0;color:#e7a8ff}p{opacity:.82;line-height:1.45}.messages{flex:1;min-height:250px;max-height:58vh;overflow:auto}.msg{padding:11px;margin:8px 0;border:1px solid #33203d;border-radius:12px;background:var(--card);line-height:1.4}.you{background:#2a1730;border-color:#51315f}input,button{font:inherit;padding:12px;border-radius:11px;border:1px solid var(--line)}input{width:100%;background:#09070c;color:#fff;outline:none}button{background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#211127}.status{padding:10px 12px;border:1px solid #33203d;border-radius:11px;background:#0c0810;color:#e7bfff}.badge{font-size:13px;opacity:.75}</style></head><body><section class="stage"><div id="lunaWrap" class="luna-wrap"><canvas id="canvas" aria-label="Luna gothic vampire companion"></canvas></div></section><aside><h1>Mira ♡</h1><div class="badge">Luna — gothic vampire companion</div><p>Chrome-only. Luna uses the vampire demon portrait. Voice input and speech run in Chrome.</p><div id="messages" class="messages"></div><input id="text" autocomplete="off" placeholder="Talk to Luna"><button id="send">Speak</button><button id="call" class="secondary">Start voice call</button><div id="status" class="status">Loading Luna…</div></aside><script>const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d");let source=null,basePixels=null,mouthPixels=[],speaking=false,call=false,rec=null,raf=0,phase=0,chat=JSON.parse(localStorage.getItem("lunaChat")||"[]");const MOUTH={x:.52,y:.73,w:.30,h:.19};function loadLuna(){const img=new Image();img.onload=()=>{source=img;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;preparePixels();drawFrame(0);$("status").textContent="Luna ready"};img.onerror=()=>$("status").textContent="Could not load vampire demon.jpg";img.src="../vampire demon.jpg"}function preparePixels(){const off=document.createElement("canvas");off.width=canvas.width;off.height=canvas.height;const oc=off.getContext("2d");try{oc.drawImage(source,0,0);basePixels=oc.getImageData(0,0,canvas.width,canvas.height)}catch(e){basePixels=null;return}const w=canvas.width,h=canvas.height,x0=Math.floor(w*(MOUTH.x-MOUTH.w/2)),x1=Math.ceil(w*(MOUTH.x+MOUTH.w/2)),y0=Math.floor(h*(MOUTH.y-MOUTH.h/2)),y1=Math.ceil(h*(MOUTH.y+MOUTH.h/2));for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3){const i=(y*w+x)*4,r=basePixels.data[i],g=basePixels.data[i+1],b=basePixels.data[i+2],inside=((x-w*MOUTH.x)/(w*MOUTH.w*.5))**2+((y-h*MOUTH.y)/(h*MOUTH.h*.5))**2<=1;if(inside&&((r+g+b)<420||r>g*1.1))mouthPixels.push({x,y,i})}}function drawFrame(open){if(!source)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);if(!basePixels)return;const w=canvas.width,h=canvas.height,a=Math.max(0,Math.min(1,open));for(const p of mouthPixels){const nx=(p.x-w*MOUTH.x)/(w*MOUTH.w*.5),ny=(p.y-h*MOUTH.y)/(h*MOUTH.h*.5),weight=Math.max(.08,1-Math.abs(nx)*.8),dy=Math.round((ny<0?-1:1)*h*.055*a*weight),dx=Math.round(nx*w*.018*a*weight),i=p.i;ctx.fillStyle=`rgba(${basePixels.data[i]},${basePixels.data[i+1]},${basePixels.data[i+2]},${basePixels.data[i+3]/255})`;ctx.fillRect(p.x+dx,p.y+dy,3,3)}if(a>.12){ctx.save();ctx.globalAlpha=.18+.28*a;ctx.fillStyle="#16070e";ctx.beginPath();ctx.ellipse(w*MOUTH.x,h*MOUTH.y,w*MOUTH.w*(.28+.36*a)/2,h*(.025+.07*a)/2,0,0,Math.PI*2);ctx.fill();ctx.restore()}}function animate(){if(!speaking){raf=0;drawFrame(0);return}phase+=.19;const a=(Math.sin(phase)+1)/2,b=(Math.sin(phase*2.4+1)+1)/2;drawFrame(Math.min(1,.04+.62*a*a+.25*b));raf=requestAnimationFrame(animate)}function setSpeaking(v){speaking=v;$("lunaWrap").classList.toggle("speaking",v);$("status").textContent=v?"Luna is speaking…":call?"Listening…":"Ready";if(v&&!raf){phase=0;raf=requestAnimationFrame(animate)}}function esc(s){return String(s).replace(/[&<>\\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\":"&#92;","\"":"&quot;"}[c]))}function render(){$("messages").innerHTML=chat.map(x=>`<div class="msg ${x.u?'you':''}"><b>${x.u?'You':'Luna'}:</b> ${esc(x.t)}</div>`).join("");$("messages").scrollTop=$("messages").scrollHeight}function reply(t){t=t.trim();if(!t)return;chat.push({u:1,t});let r=/^(hi|hello|hey)\b/i.test(t)?"Mhm… hello. I was waiting for you.":/how are you/i.test(t)?"I am doing nicely now that you are talking to me.":/love|miss you/i.test(t)?"Stay with me a little longer.":/bye|goodbye/i.test(t)?"Come back when you want to talk again.":"I heard you. Tell me more about that.";chat.push({t:r});localStorage.setItem("lunaChat",JSON.stringify(chat.slice(-60)));render();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r);u.rate=.94;u.pitch=1.04;u.onstart=()=>setSpeaking(true);u.onend=()=>{setSpeaking(false);if(call)setTimeout(listen,350)};u.onerror=()=>setSpeaking(false);speechSynthesis.speak(u)}function listen(){if(!call)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("status").textContent="Chrome speech recognition is unavailable";return}if(rec)return;rec=new SR();rec.lang="en-US";rec.continuous=false;rec.interimResults=false;rec.onstart=()=>$("status").textContent="Listening…";rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||"";rec=null;reply(t)};rec.onend=()=>{rec=null;if(call&&!speechSynthesis.speaking)setTimeout(listen,450)};rec.onerror=()=>{rec=null;if(call)setTimeout(listen,900)};try{rec.start()}catch{rec=null;if(call)setTimeout(listen,900)}}$("send").onclick=()=>{const t=$("text").value;$("text").value="";reply(t)};$("text").onkeydown=e=>{if(e.key==="Enter")$("send").click()};$("call").onclick=()=>{call=!call;$("call").textContent=call?"End voice call":"Start voice call";if(call)listen();else{try{rec?.stop()}catch{}rec=null;speechSynthesis.cancel();setSpeaking(false);$("status").textContent="Ready"}};loadLuna();render();</script></body></html>
