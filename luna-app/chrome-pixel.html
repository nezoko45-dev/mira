<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira — Luna</title><style>body{margin:0;background:#07050a;color:#fff;font:16px system-ui;display:grid;grid-template-columns:1fr 330px;min-height:100vh}.stage{display:grid;place-items:center;background:#160a19}canvas{max-width:92vw;max-height:92vh;border-radius:20px;box-shadow:0 0 30px #6b287f}aside{padding:20px;background:#120b16}button,input{font:inherit;padding:11px;border-radius:10px;border:1px solid #4b2860}input{background:#09070c;color:white}button{background:#c45cff;color:white;font-weight:700}.messages{height:60vh;overflow:auto}.msg{padding:9px;margin:7px 0;background:#1d1020;border-radius:10px}</style></head><body><section class="stage"><canvas id="canvas"></canvas></section><aside><h1>Mira ♡</h1><p>Luna's real photograph pixels are remapped around her mouth while she speaks. There is no mouth mask or overlay.</p><div id="messages" class="messages"></div><input id="text" placeholder="Talk to Luna"><button id="send">Speak</button><button id="call">Start voice call</button><p id="status">Loading Luna…</p></aside><script>const $=x=>document.getElementById(x),c=$("canvas"),x=c.getContext("2d",{willReadFrequently:true});let base=null,speaking=false,call=false,rec=null,raf=0,t=0,chat=JSON.parse(localStorage.getItem("lunaChat")||"[]");const img=new Image();img.onload=()=>{c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);base=x.getImageData(0,0,c.width,c.height);frame(0);$("status").textContent="Luna ready"};img.onerror=()=>$("status").textContent="Put vampire demon.jpg beside chrome-pixel.html";img.src="vampire demon.jpg";const M={x:.50,y:.725,rx:.205,ry:.095};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function frame(open){if(!base)return;const w=c.width,h=c.height,s=base.data,o=new ImageData(new Uint8ClampedArray(s),w,h),d=o.data,cx=w*M.x,cy=h*M.y,rx=w*M.rx,ry=h*M.ry,scale=.58+open*.72;for(let y=Math.floor(cy-ry-5);y<=Math.ceil(cy+ry+5);y++){if(y<0||y>=h)continue;for(let z=Math.floor(cx-rx-5);z<=Math.ceil(cx+rx+5);z++){if(z<0||z>=w)continue;let nx=(z-cx)/rx,ny=(y-cy)/ry,r=nx*nx+ny*ny;if(r>1.12)continue;let q=clamp(1-r,0,1),sx=clamp(Math.round(cx+(z-cx)*(1-.035*q)),0,w-1),sy=clamp(Math.round(cy+(y-cy)/(1+(scale-1)*q)),0,h-1),si=(sy*w+sx)*4,di=(y*w+z)*4,m=.86*q;d[di]=s[di]*(1-m)+s[si]*m;d[di+1]=s[di+1]*(1-m)+s[si+1]*m;d[di+2]=s[di+2]*(1-m)+s[si+2]*m}}x.putImageData(o,0,0)}function animate(){if(!speaking){raf=0;frame(0);return}t+=.19;frame((Math.sin(t)+1)/2);raf=requestAnimationFrame(animate)}function render(){$("messages").innerHTML=chat.map(v=>`<div class="msg"><b>${v.u?'You':'Luna'}:</b> ${v.t}</div>`).join('');$("messages").scrollTop=$("messages").scrollHeight}function say(text){text=text.trim();if(!text)return;chat.push({u:1,t:text});let r=/^(hi|hello|hey)\b/i.test(text)?'Mhm… hello. I was waiting for you.':/how are you/i.test(text)?'I am doing nicely now that you are talking to me.':/love|miss you/i.test(text)?'Stay with me a little longer.':'I heard you. Tell me more about that.';chat.push({t:r});localStorage.setItem('lunaChat',JSON.stringify(chat.slice(-60)));render();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(r);u.rate=.94;u.pitch=1.04;u.onstart=()=>{speaking=true;$("status").textContent='Luna is speaking…';if(!raf)raf=requestAnimationFrame(animate)};u.onend=()=>{speaking=false;$("status").textContent=call?'Listening…':'Ready';if(call)setTimeout(listen,350)};speechSynthesis.speak(u)}function listen(){if(!call||rec)return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("status").textContent='Chrome speech recognition unavailable';return}rec=new SR();rec.lang='en-US';rec.continuous=false;rec.onstart=()=>$("status").textContent='Listening…';rec.onresult=e=>{let q=e.results?.[0]?.[0]?.transcript||'';rec=null;say(q)};rec.onend=()=>{rec=null;if(call&&!speechSynthesis.speaking)setTimeout(listen,450)};rec.onerror=()=>{rec=null;if(call)setTimeout(listen,900)};try{rec.start()}catch{rec=null}}$("send").onclick=()=>{let q=$("text").value;$("text").value='';say(q)};$("text").onkeydown=e=>{if(e.key==='Enter')$("send").click()};$("call").onclick=()=>{call=!call;$("call").textContent=call?'End voice call':'Start voice call';if(call)listen();else{try{rec?.stop()}catch{}rec=null;speechSynthesis.cancel();speaking=false;frame(0);$("status").textContent='Ready'}};render();</script></body></html>
