<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Gothic Companion</title><style>
*{box-sizing:border-box}body{margin:0;background:#08060a;color:#f5eaf3;font-family:system-ui,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;max-width:1400px;margin:auto}.card{background:#130d16;border:1px solid #3c2638;border-radius:22px;overflow:hidden}.stage{min-height:calc(100vh - 32px);display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#31172f,#09070b 68%)}#luna,#video{max-width:92%;max-height:82vh;border-radius:18px;object-fit:contain}#video{display:none}.talking{filter:drop-shadow(0 0 25px #d65caa)}.bar{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;background:linear-gradient(#09070bdd,transparent)}.brand{font-weight:900;letter-spacing:.14em}.status{font-size:12px;color:#bcaeba}.caption{position:absolute;bottom:18px;left:5%;right:5%;padding:13px 16px;border-radius:14px;background:#09070bee;text-align:center}.side{padding:20px;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}h1{margin:0 0 4px}.small{font-size:12px;color:#9d8b9a}.messages{flex:1;overflow:auto;margin-top:16px;min-height:300px}.msg{padding:10px 12px;margin:8px 0;border-radius:14px;white-space:pre-wrap}.you{background:#241823;margin-left:12%}.lunaMsg{background:#1a1019;margin-right:8%}.row{display:flex;gap:8px;margin-top:10px}input{flex:1;background:#0b080d;color:white;border:1px solid #52344c;border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:11px 14px;background:#b34e8c;color:white;font-weight:800;cursor:pointer}.call{width:100%;margin-top:10px;background:#e267aa}.call.active{background:#5c304b}.note{margin-top:12px;padding:11px;border:1px solid #382431;border-radius:12px;color:#ad9baa;font-size:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{min-height:65vh}.side{min-height:auto}}
</style></head><body><main class="app"><section class="card stage"><div class="bar"><div class="brand">LUNA 🖤</div><div id="status" class="status">Starting…</div></div><img id="luna" src="/luna.png" alt="Luna"><video id="video" playsinline></video><div id="caption" class="caption">Luna is here.</div></section><aside class="card side"><h1>Luna</h1><div class="small">HTML + JavaScript + Python backend</div><div id="messages" class="messages"></div><div class="row"><input id="text" placeholder="Talk to Luna…"><button id="send">Send</button></div><button id="call" class="call">☎ Start voice call</button><div class="note">The Python EXE creates a fresh MP4 from <b>luna.png</b> whenever Luna replies. The animation is audio-driven, so no second mouth image is required.</div></aside></main><script>
const $=id=>document.getElementById(id);let messages=JSON.parse(localStorage.getItem('lunaMessages')||'[]');let call=false,rec=null;function save(){localStorage.setItem('lunaMessages',JSON.stringify(messages.slice(-60)));render()}function render(){const b=$('messages');b.innerHTML='';messages.slice(-60).forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.role==='user'?'you':'lunaMsg');d.textContent=(m.role==='user'?'You: ':'Luna: ')+m.text;b.appendChild(d)});b.scrollTop=b.scrollHeight}async function api(path,text=''){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});let d=await r.json();if(!r.ok)throw Error(d.error||'Backend error');return d}function playVideo(b64){if(!b64)return;$('luna').style.display='none';let v=$('video');v.src='data:video/mp4;base64,'+b64;v.style.display='block';v.classList.add('talking');v.onended=()=>{v.pause();v.removeAttribute('src');v.style.display='none';$('luna').style.display='block';v.classList.remove('talking');$('status').textContent=call?'Listening':'Ready'};v.play().catch(()=>{})}async function talk(text){text=text.trim();if(!text)return;messages.push({role:'user',text});save();$('status').textContent='Luna is speaking…';$('caption').textContent='Creating her video…';try{let d=await api('/chat',text);messages.push({role:'assistant',text:d.reply});save();$('caption').textContent=d.reply;playVideo(d.video_base64);if(!call)$('status').textContent='Ready'}catch(e){$('status').textContent='Backend error';$('caption').textContent=e.message}}$('send').onclick=()=>{let t=$('text').value;$('text').value='';talk(t)};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};function setupRec(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('caption').textContent='Speech recognition is unavailable in this browser.';return null}let r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)talk(e.results[i][0].transcript)};r.onerror=e=>{$('caption').textContent='Microphone: '+e.error};r.onend=()=>{if(call)try{r.start()}catch{}};return r}$('call').onclick=async()=>{if(!call){call=true;$('call').textContent='■ End voice call';$('call').classList.add('active');rec=setupRec();if(rec)try{rec.start()}catch{}$('status').textContent='Listening';$('caption').textContent='Luna is listening…'}else{call=false;$('call').textContent='☎ Start voice call';$('call').classList.remove('active');try{rec?.stop()}catch{}rec=null;$('status').textContent='After the call…';$('caption').textContent='One moment…';try{let d=await api('/after-call');messages.push({role:'assistant',text:d.reply});save();$('caption').textContent=d.reply;playVideo(d.video_base64)}catch(e){$('caption').textContent=e.message}$('status').textContent='Ready'}};fetch('/health').then(r=>r.json()).then(d=>{$('status').textContent=d.video?'Ready':'Image missing'}).catch(()=>$('status').textContent='Backend offline');render();
</script></body></html>
