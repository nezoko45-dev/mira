<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Gothic Companion</title><style>*{box-sizing:border-box}body{margin:0;background:#08060a;color:#f5eaf3;font-family:system-ui,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;max-width:1400px;margin:auto}.card{background:#130d16;border:1px solid #3c2638;border-radius:22px;overflow:hidden}.stage{min-height:calc(100vh - 32px);display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#31172f,#09070b 68%)}#luna,#video{max-width:92%;max-height:82vh;border-radius:18px;object-fit:contain}#video{display:none}.talking{filter:drop-shadow(0 0 25px #d65caa)}.bar{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;background:linear-gradient(#09070bdd,transparent)}.brand{font-weight:900;letter-spacing:.14em}.status{font-size:12px;color:#bcaeba}.caption{position:absolute;bottom:18px;left:5%;right:5%;padding:13px 16px;border-radius:14px;background:#09070bee;text-align:center}.side{padding:20px;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}h1{margin:0 0 4px}.small{font-size:12px;color:#9d8b9a}.messages{flex:1;overflow:auto;margin-top:16px;min-height:300px}.msg{padding:10px 12px;margin:8px 0;border-radius:14px;white-space:pre-wrap}.you{background:#241823;margin-left:12%}.lunaMsg{background:#1a1019;margin-right:8%}.row{display:flex;gap:8px;margin-top:10px}input{flex:1;background:#0b080d;color:white;border:1px solid #52344c;border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:11px 14px;background:#b34e8c;color:white;font-weight:800;cursor:pointer}.call{width:100%;margin-top:10px;background:#e267aa}.call.active{background:#5c304b}.cloud{margin-top:12px;padding:12px;border:1px solid #52344c;border-radius:14px}.cloud input{width:100%;margin-top:7px}.cloud button{margin-top:8px;width:100%}.note{margin-top:12px;padding:11px;border:1px solid #382431;border-radius:12px;color:#ad9baa;font-size:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{min-height:65vh}.side{min-height:auto}}</style></head><body><main class="app"><section class="card stage"><div class="bar"><div class="brand">LUNA 🖤</div><div id="status" class="status">Cloud lip-sync ready</div></div><img id="luna" src="https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna%20mouth%20closed.png" alt="Luna"><video id="video" playsinline controls></video><div id="caption" class="caption">Luna is here.</div></section><aside class="card side"><h1>Luna</h1><div class="small">Chrome HTML app • hosted Wav2Lip • no local Python or Electron</div><div id="messages" class="messages"></div><div class="row"><input id="text" placeholder="Talk to Luna…"><button id="send">Send</button></div><button id="call" class="call">☎ Start voice call</button><div class="cloud"><b>Wav2Lip Cloud test</b><div class="small">Choose a short audio clip. The hosted Wav2Lip Space will animate Luna's single image.</div><input id="audio" type="file" accept="audio/*"><button id="lip">Animate Luna</button></div><div class="note">Uses the hosted Gradio Wav2Lip API. Luna uses only the single mouth-closed image.</div></aside></main><script type="module">
import{Client,handle_file}from"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const LUNA_IMAGE_URL="https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna%20mouth%20closed.png";
const HF_SPACE="manavisrani07/gradio-lipsync-wav2lip";
const $=id=>document.getElementById(id);
let messages=JSON.parse(localStorage.getItem('lunaMessages')||'[]'),call=false,rec=null;
function save(){localStorage.setItem('lunaMessages',JSON.stringify(messages.slice(-60)));render()}
function render(){const b=$('messages');b.innerHTML='';messages.slice(-60).forEach(m=>{let d=document.createElement('div');d.className='msg '+(m.role==='user'?'you':'lunaMsg');d.textContent=(m.role==='user'?'You: ':'Luna: ')+m.text;b.appendChild(d)});b.scrollTop=b.scrollHeight}
function playVideo(url){$('luna').style.display='none';let v=$('video');v.src=url;v.style.display='block';v.classList.add('talking');v.onended=()=>{v.pause();v.removeAttribute('src');v.style.display='none';$('luna').style.display='block';v.classList.remove('talking');$('status').textContent='Ready'};v.play().catch(()=>{v.controls=true})}
function findVideo(value,seen=new Set()){if(value==null)return null;if(typeof value==='string'){if(/^https?:\/\//i.test(value)&&(/\.mp4/i.test(value)||/\/file=/i.test(value)||/gradio_api\/file/i.test(value)))return value;if(/^\//.test(value)&&(/\.mp4/i.test(value)||/file=/i.test(value)))return value;return null}if(typeof value!=='object'||seen.has(value))return null;seen.add(value);for(const k of ['url','path','video','file','value']){if(value[k]!=null){const found=findVideo(value[k],seen);if(found)return found}}if(Array.isArray(value)){for(const item of value){const found=findVideo(item,seen);if(found)return found}}else{for(const k of Object.keys(value)){const found=findVideo(value[k],seen);if(found)return found}}return null}
function normalizeUrl(url){if(!url)return null;if(/^https?:\/\//i.test(url))return url;if(url.startsWith('/file='))return 'https://manavisrani07-gradio-lipsync-wav2lip.hf.space'+url;if(url.startsWith('/gradio_api/file='))return 'https://manavisrani07-gradio-lipsync-wav2lip.hf.space'+url;if(url.startsWith('/'))return 'https://manavisrani07-gradio-lipsync-wav2lip.hf.space/file='+url.replace(/^\/+/,'');return 'https://manavisrani07-gradio-lipsync-wav2lip.hf.space/file='+url.replace(/^\/+/,'')}
async function animateLuna(){const file=$('audio').files[0];if(!file){$('caption').textContent='Choose an audio file first.';return}$('lip').disabled=true;$('status').textContent='Connecting to Wav2Lip…';$('caption').textContent='Uploading Luna image and audio…';try{const imageResponse=await fetch(LUNA_IMAGE_URL,{cache:'no-store'});if(!imageResponse.ok)throw Error('Could not load Luna image from GitHub.');const imageBlob=await imageResponse.blob();const imageFile=new File([imageBlob],'luna-mouth-closed.png',{type:imageBlob.type||'image/png'});const app=await Client.connect(HF_SPACE,{status_callback:s=>{console.log('Wav2Lip Space status:',s)}});$('status').textContent='Sending to Wav2Lip…';const r=await app.predict('/generate',[handle_file(imageFile),handle_file(file),'wav2lip_gan',false,1,0,10,0,0]);console.log('Wav2Lip result:',r);const url=normalizeUrl(findVideo(r?.data??r));if(!url)throw Error('Wav2Lip finished but did not expose a playable MP4 file.');$('status').textContent='Playing Luna MP4…';$('caption').textContent='Luna is speaking.';playVideo(url)}catch(e){console.error('Wav2Lip:',e);$('status').textContent='Wav2Lip error';$('caption').textContent='Wav2Lip: '+(e?.message||e)}finally{$('lip').disabled=false}}
$('lip').onclick=animateLuna;
$('send').onclick=()=>{let t=$('text').value.trim();if(!t)return;$('text').value='';messages.push({role:'user',text:t});messages.push({role:'assistant',text:'I heard you. Use Animate Luna to test the hosted Wav2Lip animation.'});save()};
$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
function setupRec(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('caption').textContent='Speech recognition is unavailable in this browser.';return null}let r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){messages.push({role:'user',text:e.results[i][0].transcript});save()}};r.onerror=e=>{$('caption').textContent='Microphone: '+e.error};r.onend=()=>{if(call)try{r.start()}catch{}};return r}
$('call').onclick=()=>{if(!call){call=true;$('call').textContent='■ End voice call';$('call').classList.add('active');rec=setupRec();if(rec)try{rec.start()}catch{}$('status').textContent='Listening';$('caption').textContent='Luna is listening…'}else{call=false;$('call').textContent='☎ Start voice call';$('call').classList.remove('active');try{rec?.stop()}catch{}rec=null;$('status').textContent='Ready';$('caption').textContent='Call ended.'}};render();
</script></body></html>
