<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Gothic Companion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08060a;color:#f5eaf3;font-family:system-ui,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;max-width:1400px;margin:auto}.card{background:#130d16;border:1px solid #3c2638;border-radius:22px;overflow:hidden}.stage{min-height:calc(100vh - 32px);display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#31172f,#09070b 68%)}#luna,#video{max-width:92%;max-height:82vh;border-radius:18px;object-fit:contain}#video{display:none}.talking{filter:drop-shadow(0 0 25px #d65caa)}.bar{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;background:linear-gradient(#09070bdd,transparent)}.brand{font-weight:900;letter-spacing:.14em}.status{font-size:12px;color:#bcaeba}.caption{position:absolute;bottom:18px;left:5%;right:5%;padding:13px 16px;border-radius:14px;background:#09070bee;text-align:center}.side{padding:20px;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}h1{margin:0 0 4px}.small{font-size:12px;color:#9d8b9a}.messages{flex:1;overflow:auto;margin-top:16px;min-height:300px}.msg{padding:10px 12px;margin:8px 0;border-radius:14px;white-space:pre-wrap}.you{background:#241823;margin-left:12%}.lunaMsg{background:#1a1019;margin-right:8%}.row{display:flex;gap:8px;margin-top:10px}input{flex:1;background:#0b080d;color:white;border:1px solid #52344c;border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:11px 14px;background:#b34e8c;color:white;font-weight:800;cursor:pointer}.call{width:100%;margin-top:10px;background:#e267aa}.call.active{background:#5c304b}.cloud{margin-top:12px;padding:12px;border:1px solid #52344c;border-radius:14px}.cloud input{width:100%;margin-top:7px}.cloud button{margin-top:8px;width:100%}.note{margin-top:12px;padding:11px;border:1px solid #382431;border-radius:12px;color:#ad9baa;font-size:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.stage{min-height:65vh}.side{min-height:auto}}
</style></head>
<body>
<main class="app"><section class="card stage"><div class="bar"><div class="brand">LUNA 🖤</div><div id="status" class="status">Ready</div></div><img id="luna" src="luna.png" alt="Luna" onerror="this.src='https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna%20mouth%20closed.png'"><video id="video" playsinline controls preload="metadata"></video><div id="caption" class="caption">Luna is here.</div></section>
<aside class="card side"><h1>Luna</h1><div class="small">Chrome HTML app • hosted Wav2Lip • no Python or Electron</div><div id="messages" class="messages"></div><div class="row"><input id="text" placeholder="Talk to Luna…"><button id="send">Send</button></div><button id="call" class="call">☎ Start voice call</button><div class="cloud"><b>Wav2Lip Cloud</b><div class="small">Choose an audio clip to animate Luna's single image.</div><input id="audio" type="file" accept="audio/*"><button id="lip">Animate Luna</button></div><div class="note">The video is only shown after Chrome confirms that the returned MP4 has real video metadata.</div></aside></main>
<script>
const $=id=>document.getElementById(id);let messages=[];try{messages=JSON.parse(localStorage.getItem('lunaMessages')||'[]')}catch{}let call=false,rec=null;
function render(){const b=$('messages');b.innerHTML='';messages.slice(-60).forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'you':'lunaMsg');d.textContent=(m.role==='user'?'You: ':'Luna: ')+m.text;b.appendChild(d)});b.scrollTop=b.scrollHeight}function save(){try{localStorage.setItem('lunaMessages',JSON.stringify(messages.slice(-60)))}catch{}render()}
function resetVideo(){const v=$('video');v.pause();v.removeAttribute('src');v.load();v.style.display='none';v.classList.remove('talking');$('luna').style.display='block'}
function playVideo(url){return new Promise((resolve,reject)=>{const v=$('video');let done=false;const fail=()=>{if(done)return;done=true;resetVideo();reject(new Error('Chrome could not load the generated MP4. The cloud service returned an invalid or inaccessible video file.'))};v.onloadedmetadata=()=>{if(!Number.isFinite(v.duration)||v.duration<=0){fail();return}if(done)return;done=true;$('luna').style.display='none';v.style.display='block';v.classList.add('talking');$('status').textContent='Luna is speaking';$('caption').textContent='Luna is speaking.';v.play().catch(()=>{v.controls=true});resolve()};v.onerror=fail;v.onended=()=>{resetVideo();$('status').textContent='Ready';$('caption').textContent='Luna is here.'};v.src=url;v.load()})}
function collectCandidates(x,out=[],seen=new Set()){if(x==null)return out;if(typeof x==='object'){if(seen.has(x))return out;seen.add(x)}if(typeof x==='string'){if(/^https?:\/\//i.test(x)||/^\//.test(x)||/^results\//.test(x))out.push(x);return out}if(Array.isArray(x)){x.forEach(v=>collectCandidates(v,out,seen));return out}if(typeof x==='object'){for(const k of ['url','path','video','file','value'])if(x[k]!=null)collectCandidates(x[k],out,seen);for(const k of Object.keys(x))if(!['url','path','video','file','value'].includes(k))collectCandidates(x[k],out,seen)}return out}
function normalizeCandidates(values,host){const out=[];for(const raw of values){if(!raw)continue;if(/^https?:\/\//i.test(raw)){out.push(raw);continue}const p=String(raw).replace(/^\/+?/,'');out.push(host+'/file='+p);out.push(host+'/gradio_api/file='+p);if(/^file=/.test(p)){out.push(host+'/'+p)}if(/^gradio_api\/file=/.test(p)){out.push(host+'/'+p)}}return [...new Set(out)]}
async function animateLuna(){const file=$('audio').files[0];if(!file){$('caption').textContent='Choose an audio file first.';return}$('lip').disabled=true;resetVideo();$('status').textContent='Loading Wav2Lip…';$('caption').textContent='Connecting to hosted lip-sync…';try{const mod=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');const app=await mod.Client.connect('manavisrani07/gradio-lipsync-wav2lip',{status_callback:s=>console.log('Wav2Lip Space:',s)});const api=await app.view_api();const spec=api.named_endpoints?.['/generate'];if(!spec)throw Error('The hosted Wav2Lip Space does not expose /generate.');const params=spec.parameters||[];const imageRef=mod.handle_file('https://raw.githubusercontent.com/nezoko45-dev/mira/main/luna%20mouth%20closed.png');const values=params.map(p=>{const n=(p.parameter_name||p.name||p.label||'').toLowerCase();if(/video|image|face/.test(n))return imageRef;if(/audio|sound/.test(n))return mod.handle_file(file);if(/checkpoint|model/.test(n))return 'wav2lip_gan';if(/no.?smooth/.test(n))return false;if(/resize/.test(n))return 1;if(/pad.?top/.test(n))return 0;if(/pad.?bottom/.test(n))return 10;if(/pad.?left/.test(n)||/pad.?right/.test(n))return 0;if(p.enum?.length)return p.enum[0];if(p.type==='boolean')return false;if(p.type==='number')return 0;return null});console.log('Wav2Lip API params:',params);console.log('Wav2Lip values:',values);$('status').textContent='Generating MP4…';const r=await app.predict('/generate',values);console.log('Wav2Lip result:',r);const raw=collectCandidates(r?.data??r);const host='https://manavisrani07-gradio-lipsync-wav2lip.hf.space';const candidates=normalizeCandidates(raw,host);if(!candidates.length)throw Error('Wav2Lip returned no video file.');let played=false,lastError='';for(const url of candidates){try{$('caption').textContent='Checking generated MP4…';await playVideo(url);played=true;break}catch(e){lastError=e?.message||String(e);console.warn('Video candidate failed:',url,e)}}if(!played)throw Error(lastError||'No playable MP4 was returned by Wav2Lip.')}catch(e){console.error('Wav2Lip:',e);resetVideo();$('status').textContent='Wav2Lip error';$('caption').textContent='Wav2Lip: '+(e?.message||e)}finally{$('lip').disabled=false}}
$('lip').onclick=animateLuna;$('send').onclick=()=>{const t=$('text').value.trim();if(!t)return;$('text').value='';messages.push({role:'user',text:t},{role:'assistant',text:'I heard you. Press Animate Luna with an audio clip to test lip-sync.'});save()};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
function setupRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('caption').textContent='Speech recognition is unavailable in this browser.';return null}const r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){messages.push({role:'user',text:e.results[i][0].transcript});save()}};r.onerror=e=>$('caption').textContent='Microphone: '+e.error;r.onend=()=>{if(call)try{r.start()}catch{}};return r}
$('call').onclick=()=>{if(!call){call=true;$('call').textContent='■ End voice call';$('call').classList.add('active');rec=setupRec();if(rec)try{rec.start()}catch{}$('status').textContent='Listening';$('caption').textContent='Luna is listening…'}else{call=false;$('call').textContent='☎ Start voice call';$('call').classList.remove('active');try{rec?.stop()}catch{}rec=null;$('status').textContent='Ready';$('caption').textContent='Call ended.'}};render();
</script></body></html>
