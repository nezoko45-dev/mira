<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira Live</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#241126,#09070d 60%);color:#fff;font:15px system-ui}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.logo b{color:#ff5fa2}.state{color:#bbaabd}.main{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:center}.portrait{position:relative;min-height:70vh;border-radius:28px;overflow:hidden;border:1px solid #3a2745;background:#08060b;box-shadow:0 30px 100px #000}.portrait img,.portrait video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.portrait img.talk{animation:talk .45s infinite alternate}@keyframes talk{to{transform:scale(1.012);filter:brightness(1.07)}}.badge{position:absolute;left:16px;bottom:16px;padding:8px 12px;border-radius:99px;background:#120d18cc;border:1px solid #4a3553;backdrop-filter:blur(8px)}.side{display:flex;flex-direction:column;gap:12px}.panel{background:#15101cdd;border:1px solid #2f2338;border-radius:20px;padding:16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:13px;background:#2a1c31;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#ff4d98,#8d3cff)}.btn:disabled{opacity:.4;cursor:not-allowed}.chat{height:260px;overflow:auto}.msg{padding:9px 11px;background:#241a2b;border-radius:13px;margin:7px 0}.user{background:#592348;margin-left:25px}.form{display:flex;gap:7px}.form input{min-width:0;flex:1;background:#0c0910;border:1px solid #3a2944;color:#fff;padding:11px;border-radius:11px}.status{color:#a996aa;font-size:13px;line-height:1.45}.setup{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.setup[hidden]{display:none}.box{width:min(500px,100%);background:#18121f;border:1px solid #44304f;border-radius:22px;padding:20px}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:12px;border-radius:10px;border:1px solid #3c2b45;background:#0d0a10;color:#fff;width:100%}.foot{display:flex;justify-content:center;color:#786a7d;font-size:12px;padding:10px}@media(max-width:760px){.main{grid-template-columns:1fr}.portrait{min-height:60vh}.side{order:2}}</style></head><body><div class="app">
<header class="top"><div class="logo">Mira <b>Live</b></div><div id="state" class="state">Ready</div></header>
<div class="main"><section class="portrait"><img id="mira" src="/luna%20mouth%20closed.png" alt="Mira"><video id="video" hidden autoplay muted playsinline loop></video><div class="badge" id="badge">Mira is waiting…</div></section>
<aside class="side"><div class="panel"><div class="buttons"><button id="start" class="btn primary">Start Voice</button><button id="stop" class="btn" disabled>Stop</button><button id="animate" class="btn">Animate Mira</button><button id="setupBtn" class="btn">⚙ Setup</button></div><div id="status" class="status" style="margin-top:12px">Voice is off.</div></div>
<div class="panel"><b>Chat</b><div id="chat" class="chat"></div><form id="form" class="form"><input id="text" placeholder="Talk to Mira…"><button class="btn primary">Send</button></form></div>
<div class="panel"><div id="videoStatus" class="status">Video API: checking…</div></div></aside></div><footer class="foot">Mira Live · local Chrome app</footer></div>
<div id="setup" class="setup" hidden><div class="box"><h2>Setup</h2><p class="status">These values are saved locally on this PC.</p><div class="field"><label>Deepgram API Key</label><input id="dgKey" type="password"></div><div class="field"><label>Deepgram Agent ID</label><input id="dgAgent"></div><div class="field"><label>fal.ai FAL_KEY</label><input id="falKey" type="password"></div><div id="setupMsg" class="status"></div><div class="buttons" style="margin-top:14px"><button id="cancel" class="btn">Cancel</button><button id="save" class="btn primary">Save</button></div></div></div>
<script>
(function(){
var $=id=>document.getElementById(id),state=$("state"),status=$("status"),badge=$("badge"),mira=$("mira"),vid=$("video"),chat=$("chat"),setup=$("setup"),setupMsg=$("setupMsg"),videoStatus=$("videoStatus");
var session=null,mic=null,player=null,dg=null;
function set(t){state.textContent=t;status.textContent=t;badge.textContent=t}
function add(role,t){if(!t)return;var d=document.createElement("div");d.className="msg "+role;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function cfg(){return (await fetch("/api/config?"+Date.now(),{cache:"no-store"})).json()}
async function loadDG(){if(dg)return dg;set("Loading voice engine…");dg=await import("https://cdn.jsdelivr.net/npm/@deepgram/agents@0.1.2/+esm");return dg}
async function start(){
$("start").disabled=true;set("Starting…");
try{var c=await cfg();if(!c.ready)throw Error("Open Setup and save your API keys first.");var mod=await loadDG();session=new mod.AgentSession({auth:{tokenFactory:async()=>{var r=await fetch("/api/deepgram-token");if(!r.ok)throw Error(await r.text());return r.text()}},agent:c.agentId});player=new mod.AgentPlayer({sampleRate:24000});session.on("audio",x=>player.queue(x));session.on("user-started-speaking",()=>player.interrupt());session.on("agent-started-speaking",()=>mira.classList.add("talk"));session.on("agent-audio-done",()=>mira.classList.remove("talk"));session.on("conversation-text",x=>add(x.role==="assistant"?"":"user",x.content));session.on("error",e=>set("Deepgram error: "+(e.message||e)));await session.connect();mic=new mod.AgentMicrophone(x=>session.sendAudio(x),{sampleRate:16000,echoCancellation:true,noiseSuppression:true,autoGainControl:true});await mic.start();$("stop").disabled=false;$("form").querySelector("button").disabled=false;set("Mira is listening…")}catch(e){$("start").disabled=false;set("Start failed: "+(e.message||e))}}
function stop(){try{mic&&mic.stop()}catch{}try{session&&session.disconnect()}catch{}mic=null;session=null;player=null;mira.classList.remove("talk");$("start").disabled=false;$("stop").disabled=true;set("Voice is off.")}
async function animate(){var b=$("animate");b.disabled=true;videoStatus.textContent="Generating Mira video…";try{var r=await fetch("/api/video",{method:"POST"}),j=await r.json();if(!r.ok)throw Error(j.error||"Video generation failed");vid.src=j.url+"?"+Date.now();vid.hidden=false;mira.hidden=true;await vid.play().catch(()=>{});videoStatus.textContent="Mira video ready ✓"}catch(e){videoStatus.textContent=e.message||"Video generation failed"}finally{b.disabled=false}}
async function save(){setupMsg.textContent="Saving…";try{var r=await fetch("/api/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deepgramApiKey:$("dgKey").value.trim(),deepgramAgentId:$("dgAgent").value.trim(),falKey:$("falKey").value.trim()})}),j=await r.json();if(!r.ok)throw Error(j.error);setup.hidden=true;set("Ready");videoStatus.textContent="Video API connected ✓"}catch(e){setupMsg.textContent=e.message}}
$("start").onclick=start;$("stop").onclick=stop;$("animate").onclick=animate;$("setupBtn").onclick=()=>setup.hidden=false;$("cancel").onclick=()=>setup.hidden=true;$("save").onclick=save;$("form").onsubmit=e=>{e.preventDefault();var t=$("text").value.trim();if(!t||!session)return;add("user",t);session.injectUserMessage(t);$("text").value="";set("Mira is thinking…")};
(async()=>{try{var c=await cfg();if(!c.ready){setup.hidden=false;setupMsg.textContent="Enter your keys to start."}var r=await fetch("/api/video/status");var j=await r.json();videoStatus.textContent=j.configured?"Video API connected ✓":"Set FAL_KEY in Setup"}catch(e){set("Server not reachable.")}})();
})();
</script></body></html>
